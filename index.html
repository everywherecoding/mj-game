/* 橫式寬敞版：頂部三家對手條 + 中央最近打出的牌 */
function renderWideOpp(){
  const bar=$('wideOppBar'); if(!bar) return;
  bar.innerHTML='';
  if(mySeat<0){ return; }
  // 依座位順序排出三家對手（下家、對家、上家）
  const order=[(mySeat+1)%4,(mySeat+2)%4,(mySeat+3)%4];
  order.forEach(seat=>{
    const p=G.players[seat];
    const active=(G.turn===seat && G.phase==='playing');
    const meldCount=(p.melds||[]).length;
    const el=document.createElement('div');
    el.className='opp'+(active?' active':'')+(meldCount?' has-melds':'');
    el.dataset.seat = String(seat);
    el.innerHTML=
      '<span class="wind-badge">'+WIND_ZH[p.wind]+'</span>'+
      '<span class="nm">'+escapeHtml(p.name)+'</span>'+
      (seat===G.dealer?'<span class="bk">莊</span>':'')+
      '<span class="cnt">'+p.hand.length+'張</span>'+
      (meldCount?'<span class="ml">副露 '+meldCount+' 組</span>':'')+
      '<span class="sc">'+(p.score>=0?'+':'')+p.score+'</span>';
    el.style.cursor='pointer';
    el.onclick=()=>showOppMelds(seat);   // 點擊查看副露
    bar.appendChild(el);
  });
  // 中央打出的牌:保留最近一次有值的紀錄,避免下一家摸牌瞬間清空看不到
  // (內容渲染與位置由 positionWideLast 接管,這裡只負責更新 _lastShownDiscard 時間戳)
  if(G.lastDiscard){
    _lastShownDiscard = { seat:G.lastDiscard.seat, tile:G.lastDiscard.tile, ts:Date.now() };
  }
  // 新局/結算/被踢出 → 清空殘留的上次打出顯示
  if(G.phase!=='playing' && G.phase!=='over'){ _lastShownDiscard=null; }
  else if(G.phase==='playing' && !G.lastDiscard){
    const noOneDiscarded = G.players.every(p=>!p.discards || p.discards.length===0);
    if(noOneDiscarded) _lastShownDiscard=null;
  }
  // 橫式中央剩餘牌牆顯示
  const wallEl=$('wideWall');
  if(wallEl) wallEl.textContent = '牌牆 '+(G.wallCount!=null?G.wallCount:'--');
}
let _lastShownDiscard = null;

/* 顯示對手副露(吃碰槓)詳情:點擊對手條後彈出 */
function showOppMelds(seat){
  const p=G.players[seat]; if(!p) return;
  let pop=$('oppMeldPopup');
  if(!pop){
    pop=document.createElement('div'); pop.id='oppMeldPopup';
    pop.onclick=(e)=>{ if(e.target===pop){ pop.style.display='none'; pop.classList.remove('show'); pop.dataset.openSeat=''; } };
    $('table').appendChild(pop);
  }
  // 若同一對手再次點 → 視為切換關閉(避免關閉鈕被擠出視野時點不到)
  const isOpen = pop.classList.contains('show') || pop.style.display==='flex' || pop.style.display==='block';
  if(isOpen && String(pop.dataset.openSeat||'') === String(seat)){
    pop.style.display='none'; pop.classList.remove('show'); pop.dataset.openSeat='';
    return;
  }
  pop.dataset.openSeat = String(seat);
  const melds=p.melds||[];
  let html='<div class="omp-card"><div class="omp-title">'+escapeHtml(p.name)+' 的副露</div>';
  if(melds.length===0){
    html+='<div class="omp-empty">尚未有吃碰槓</div>';
  }else{
    html+='<div class="omp-list">';
    melds.forEach(m=>{
      const typeLabel = m.type==='chi'?'吃':m.type==='pong'?'碰':m.type==='ankong'?'暗槓':m.type==='addkong'?'加槓':'槓';
      html+='<div class="omp-meld"><span class="omp-type">'+typeLabel+'</span><span class="omp-tiles"></span></div>';
    });
    html+='</div>';
  }
  html+='<button class="omp-close">關閉</button></div>';
  pop.innerHTML=html;
  const meldRows=pop.querySelectorAll('.omp-meld .omp-tiles');
  melds.forEach((m,i)=>{
    const row=meldRows[i]; if(!row) return;
    const tiles = m.type==='ankong' ? [null,null,null,null] : m.tiles;
    tiles.forEach(t=> row.appendChild(t? tileEl(t) : tileEl(null,{back:true})));
  });
  pop.querySelector('.omp-close').onclick=()=>{
    pop.style.display='none'; pop.classList.remove('show'); pop.dataset.openSeat='';
  };
  // 橫式:彈窗綁定到該對手卡片下方;其他模式:畫面置中遮罩
  if(document.body.classList.contains('wide')){
    pop.classList.add('show');
    pop.style.display='block';
    // 對齊該對手卡片下方,水平方向依空間自適應
    const oppCard = document.querySelector('#wideOppBar .opp[data-seat="'+seat+'"]');
    const tableEl = document.getElementById('table');
    if(oppCard && tableEl){
      const rect = oppCard.getBoundingClientRect();
      const tRect = tableEl.getBoundingClientRect();
      const cx = rect.left - tRect.left + rect.width/2;       // 卡片水平中心(相對 table)
      const top = rect.bottom - tRect.top + 8;
      const tableW = tRect.width;
      // 先測量彈窗實際寬度
      pop.style.left = cx + 'px';
      pop.style.top  = top + 'px';
      pop.style.transform = 'translateX(-50%)';
      // 用測量值決定方向:先讓它先 render,再讀寬度做修正
      requestAnimationFrame(()=>{
        const popW = pop.offsetWidth || 200;
        const halfW = popW/2;
        const leftEdge = cx - halfW;     // 置中時的左邊界
        const rightEdge = cx + halfW;    // 置中時的右邊界
        const MARGIN = 8;
        if(rightEdge > tableW - MARGIN){
          // 右邊超出 → 改成「靠右邊框」(視窗右邊界=畫面右-margin),即從卡片往左延伸
          pop.style.left = (tableW - MARGIN) + 'px';
          pop.style.transform = 'translateX(-100%)';
        }else if(leftEdge < MARGIN){
          // 左邊超出 → 改成「靠左邊框」(視窗左邊界=margin),即從卡片往右延伸
          pop.style.left = MARGIN + 'px';
          pop.style.transform = 'translateX(0)';
        }
        // 否則保持置中(預設)
      });
    }
    // 橫式時點別處不會自動關(因為沒全螢幕遮罩),按關閉鈕關
  }else{
    pop.classList.remove('show');
    pop.style.display='flex';
    pop.style.left=''; pop.style.top=''; pop.style.transform='';
  }
}

/* 偵測「剛輪到我出牌 / 我需要回應」→ 觸發明顯提醒（橫幅+光暈+震動+語音） */
let _wasMyTurn = false;
function checkMyTurnAlert(){
  if(mySeat<0 || !G || G.phase!=='playing'){
    setTurnAlert(false); setMyDiscardBanner(false); _wasMyTurn=false; return;
  }
  // 「該我動作」= 輪到我摸/打，或 我在待回應名單且還沒回應
  const myDiscardTurn = (G.turn===mySeat && (G.turnState==='draw'||G.turnState==='discard'));
  const myRespond = !!(G.pending && G.pending.responders &&
    toArr(G.pending.responders).some(r=>r && r.seat===mySeat) &&
    !(G.pending.responses||{})[mySeat]);
  const myTurn = myDiscardTurn || myRespond;
  setTurnAlert(myTurn);
  // 橫式:輪到我出牌時持續閃爍「換你了」直到我真的出牌
  setMyDiscardBanner(myDiscardTurn);
  if(myTurn && !_wasMyTurn){
    // 從「不是我」變成「是我」→ 觸發一次性提醒(震動+語音)
    fireTurnAlert(myRespond);
  }
  _wasMyTurn = myTurn;
}
function setTurnAlert(on){
  const g=$('turnGlow'); if(g) g.classList.toggle('show', on);
}
/* 橫式:輪到我出牌時讓「換你了」橫幅持續閃爍,出牌後關閉 */
function setMyDiscardBanner(on){
  const b=$('turnBanner'); if(!b) return;
  if(on){
    b.textContent='換你了';
    b.classList.add('show');
  }else{
    b.classList.remove('show');
  }
}
function fireTurnAlert(isRespond){
  // 顯示由 setMyDiscardBanner 持續控制,這裡只負責一次性震動和語音
  try{ if(navigator.vibrate) navigator.vibrate(isRespond?[80,60,80]:200); }catch(e){}
  speak(isRespond? '輪你決定' : '換你了');
}

function renderSeat(container, seat, pos){
  const p=G.players[seat];
  container.innerHTML='';
  const isMe = seat===mySeat;
  const isActive = (G.turn===seat && G.phase==='playing');

  // 名牌
  const plate=document.createElement('div');
  plate.className='nameplate'+(isActive?' active':'');
  const handCount = p.hand.length;
  plate.innerHTML =
    '<span class="wind-badge">'+WIND_ZH[p.wind]+'</span>'+
    '<span class="pname">'+escapeHtml(p.name)+'</span>'+
    (seat===G.dealer?'<span class="banker">莊</span>':'')+
    (isMe?'':'<span class="hcount">'+handCount+'張</span>')+   /* 對手剩餘張數(精簡模式顯示) */
    '<span class="score">'+(p.score>=0?'+':'')+p.score+'</span>';

  // 副露
  const melds=document.createElement('div'); melds.className='melds';
  for(const m of p.melds){
    const md=document.createElement('div'); md.className='meld';
    const showTiles = m.type==='ankong' && !isMe
      ? [{back:true},{back:true},{back:true},{back:true}]   // 別人暗槓蓋住
      : m.tiles.map(t=>({t}));
    showTiles.forEach(o=> md.appendChild(o.back? tileEl(null,{back:true}) : tileEl(o.t)));
    melds.appendChild(md);
  }

  // 手牌
  const hand=document.createElement('div'); hand.className='hand'+(isMe?' myhand':' oppbacks');
  if(isMe){
    p.hand.forEach(t=>{
      const cls = (t===G.justDrawn && G.justDrawn? 'justdrawn':'');
      const el=tileEl(t,{cls});
      el.addEventListener('click',()=>onMyTileClick(t,el));
      hand.appendChild(el);
    });
  }else{
    // 別人：牌背，數量=手牌數
    const n=p.hand.length;
    for(let k=0;k<n;k++) hand.appendChild(tileEl(null,{back:true}));
  }

  // 佈局順序依方位（棄牌已移至中央，這裡只放名牌/副露/手牌）
  if(pos==='bottom'){
    // 渲染前先清掉「上次掛到 #table 的獨立名牌」(避免堆積)
    const oldIndep = document.getElementById('myNameplate');
    if(oldIndep) oldIndep.remove();
    // 自己：副露靠左 + 手牌在右，同一水平列(中間留間隔)；名牌在最下
    const row=document.createElement('div');
    row.className='myrow';
    melds.classList.add('my-melds');
    row.append(melds, hand);
    container.append(row);
    // 橫式:名牌獨立掛到 #table(不在 seat-bottom 裡),位置不受 seat-bottom 影響
    const isWide = document.body.classList.contains('wide');
    if(isWide){
      plate.id = 'myNameplate';
      plate.classList.add('my-nameplate-wide');
      document.getElementById('table').appendChild(plate);
    }else{
      container.appendChild(plate);
    }
  }
  else if(pos==='top'){
    // 上家：名牌在上，牌背+副露同一行(副露靠右,中間留間隔)
    const toprow=document.createElement('div');
    toprow.className='toprow';
    toprow.append(hand, melds);
    container.append(plate, toprow);
  }
  else { container.append(plate, hand, melds); }
}

/* 把四家棄牌渲染到中央集中區（依方位） */
function renderDiscards(){
  const order = mySeat>=0
    ? [mySeat,(mySeat+1)%4,(mySeat+2)%4,(mySeat+3)%4]
    : [0,1,2,3];
  const map=[['dzBottom',order[0]],['dzRight',order[1]],['dzTop',order[2]],['dzLeft',order[3]]];
  for(const [boxId,seat] of map){
    const box=$(boxId); if(!box) continue;
    box.innerHTML='';
    const p=G.players[seat];
    p.discards.forEach((t,i)=>{
      const latest = (G.lastDiscard && G.lastDiscard.seat===seat && i===p.discards.length-1);
      box.appendChild(tileEl(t,{cls: latest?'latest':''}));
    });
  }
}

let selectedTile=null;
function onMyTileClick(tile, el){

/* 操作列 */
function renderActions(){
  const box=$('actions'); box.innerHTML='';
  if(G.phase!=='playing' || mySeat<0) return;
  if(G.turn===mySeat && G.turnState==='discard'){
    const p=G.players[mySeat];
    // 自摸？
    if(G.justDrawn && MJ.isWinningHand(p.hand, p.melds.length)){
      addBtn(box,'自摸胡','win',()=>declareSelfWin(mySeat));
    }
    // 暗槓？
    const ak=MJ.getConcealedKongs(p.hand);

      ak.forEach(t=> addBtn(box,'暗槓'+MJ.zhTile(t),'',()=>declareAnkong(mySeat,t)));

      hint.textContent='點手牌兩下出牌'; box.appendChild(hint); }

function addKong(seat,tile){
  const p=G.players[seat];
  const m=p.melds.find(x=>x.type==='pong'&&x.tile===tile);
  removeN(p.hand,tile,1);
  m.type='addkong'; m.tiles=[tile,tile,tile,tile];
  G.log=p.name+' 加槓';
  kongDraw(seat); speak(p.name+'加槓');
}
function addBtn(box,label,cls,fn){

/* 回應面板 */
function renderRespond(){
  const box=$('respond');
  if(!G.pending || mySeat<0){ box.style.display='none'; stopRespondCountdown(); return; }
  const pend=G.pending;
  // responders 可能被 Firebase 序列化成物件 → 還原成陣列
  const responders = toArr(pend.responders);
  const me=responders.find(r=>r && r.seat===mySeat);
  const responses = pend.responses || {};
  if(!me || responses[mySeat]){ box.style.display='none'; stopRespondCountdown(); return; }
  const can = me.can || {};
  box.style.display='flex';
  box.innerHTML='';
  const title=document.createElement('div'); title.className='rtitle';
  title.textContent=G.players[pend.from].name+' 打出 '+MJ.zhTile(pend.tile);
  box.appendChild(title);
  const tw=document.createElement('div'); tw.className='rtile'; tw.appendChild(tileEl(pend.tile)); box.appendChild(tw);

  // 吃：列出組合（can.chi 可能被序列化變形，統一還原成陣列；每個組合也還原）
  const chiOpts = can.chi ? toArr(can.chi).map(o=>toArr(o)) : [];
  if(chiOpts.length){
    const wrap=document.createElement('div'); wrap.className='chi-opts';
    chiOpts.forEach(opt=>{
      if(opt.length<2) return;
      const row=document.createElement('div'); row.className='chi-opt';
      MJ.sortTiles([pend.tile,opt[0],opt[1]]).forEach(t=>row.appendChild(tileEl(t)));
      row.onclick=()=>submitResponse(mySeat,'chi',opt);
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
  }
  const btns=document.createElement('div'); btns.className='rbtns';
  if(can.win) addBtn(btns,'胡','win',()=>submitResponse(mySeat,'win'));
  if(can.pong) addBtn(btns,'碰','primary',()=>submitResponse(mySeat,'pong'));
  if(can.kong) addBtn(btns,'槓','',()=>submitResponse(mySeat,'kong'));
  addBtn(btns,'過','pass',()=>submitResponse(mySeat,'pass'));
  box.appendChild(btns);
  // 倒數計時(15秒,逾時自動過)
  const cd=document.createElement('div'); cd.className='rcountdown'; cd.id='respondCountdown';
  box.appendChild(cd);
  startRespondCountdown(pend._ts || Date.now());
}

/* 倒數計時:每0.1秒更新顯示剩餘秒數 */
let _cdTimer=null;
function startRespondCountdown(startTs){
  stopRespondCountdown();
  const TOTAL=15000;
  const update=()=>{
    const el=$('respondCountdown'); if(!el) return stopRespondCountdown();
    const remain=Math.max(0, TOTAL - (Date.now() - startTs));
    const sec=(remain/1000).toFixed(1);
    el.textContent='剩 '+sec+' 秒（逾時自動過）';
    el.classList.toggle('warn', remain<=5000);
    if(remain<=0) stopRespondCountdown();
  };
  update();
  _cdTimer=setInterval(update, 100);
}
function stopRespondCountdown(){ if(_cdTimer){ clearInterval(_cdTimer); _cdTimer=null; } }

/* 結算 */
let _resultKey = null;   // 記住目前結算畫面內容，避免頻繁 render 重建 DOM 洗掉按鈕
function renderResult(){
  const wrap=$('result');
  // 最終總結算（打完所有局數）
  if(G.phase==='finished'){
    wrap.style.display='flex';
    if(_resultKey!=='finished'){ _resultKey='finished'; renderFinalResult(); }
    // 不管DOM有沒有重建,都重綁按鈕onclick(防止onclick因任何原因遺失)
    const fb=$('btnFinalNew');
    if(fb) fb.onclick=()=>{ if(G) G.players.forEach(p=>p.score=0); newGame(false); };
    return;
  }
  if(G.phase!=='over'){ wrap.style.display='none'; _resultKey=null; return; }
  wrap.style.display='flex';
  const c=$('resultCard');
  const r=G.result;
  const rno=G.roundNo||1, rtot=G.totalRounds||totalRounds;
  // 用一個 key 代表目前結算內容；若沒變就不重建 DOM（否則每次 render 都重設 innerHTML
  // 會把使用者正要點的「下一局/看總結算」按鈕換成新節點，導致點擊落空、看似沒反應）
  const key = G.phase+'|'+(r? (r.draw?'draw':(r.seat+'_'+r.taiTotal+'_'+r.payEach)) :'none')+'|'+rno+'/'+rtot;
  if(key!==_resultKey){
    _resultKey = key;
    const roundTag = rtot>=999? '' : '<div class="sub" style="color:var(--gold)">第 '+rno+' / '+rtot+' 局</div>';
    const isLast = (rtot<999 && rno>=rtot && !(r&&r.draw));
    const nextLabel = isLast? '看總結算' : '下一局';
    if(r&&r.draw){
      c.innerHTML='<h2>流局</h2>'+roundTag+'<div class="sub">牌牆已盡，無人胡牌（莊家續莊）</div>'+
        '<button class="go" style="margin-top:10px" id="btnNext">續局</button>';
    }else if(r){
      const p=G.players[r.seat];
      let taiHtml=r.items.map(it=>'<div class="tai-row"><span>'+it.name+'</span><b>'+it.tai+' 台</b></div>').join('');
      if(!taiHtml) taiHtml='<div class="tai-row"><span>無台（雞胡）</span><b>0 台</b></div>';
      c.innerHTML=
        '<h2>'+escapeHtml(p.name)+(r.selfDraw?' 自摸':' 胡牌')+'</h2>'+
        roundTag+
        '<div class="sub">'+(r.selfDraw?'三家各付':(G.players[r.loser].name+' 放槍'))+'</div>'+
        '<div class="winhand" id="rHand"></div>'+
        '<div class="tai-list">'+taiHtml+'</div>'+
        '<div class="total">合計 <b>'+r.taiTotal+'</b> 台（每家付 '+r.payEach+'）</div>'+
        '<button class="go" id="btnNext">'+nextLabel+'</button>';
      const rh=$('rHand');
      r.hand.forEach(t=>rh.appendChild(tileEl(t)));
      r.melds.forEach(m=>{ const sep=document.createElement('div'); sep.style.width='8px'; rh.appendChild(sep);
        m.tiles.forEach(t=>rh.appendChild(tileEl(t))); });
    }
  }
  // 不管 key 有沒有變,每次 render 都重綁 onclick(防止 onclick 因任何原因遺失)
  const nb=$('btnNext'); if(nb) nb.onclick=()=>{ nextRound(); };
}

/* 最終總結算：每人總輸贏 */
function renderFinalResult(){
  const c=$('resultCard');
  const scores = (G.finalScores && G.finalScores.length? G.finalScores : G.players.map(p=>({name:p.name,score:p.score})));
  // 依分數高到低排序
  const ranked = scores.map((s,i)=>({...s, seat:i})).sort((a,b)=>b.score-a.score);
  const rtot=G.totalRounds||totalRounds;
  let rows='';
  ranked.forEach((s,idx)=>{
    const medal = ['🥇','🥈','🥉','　'][idx]||'　';
    const sign = s.score>0?'+':'';
    const color = s.score>0?'#5fb98a': (s.score<0?'#e08a5a':'var(--muted)');
    rows += '<div class="tai-row" style="font-size:16px;padding:8px 0">'+
      '<span>'+medal+' '+escapeHtml(s.name)+'</span>'+
      '<b style="color:'+color+'">'+sign+s.score+' 點</b></div>';
  });
  // 結算說明：正分=該收、負分=該付（一點對應你們約定的金額）
  c.innerHTML=
    '<h2 style="font-size:26px">🏆 全部結束</h2>'+
    '<div class="sub">共 '+rtot+' 局・最終輸贏統計</div>'+
    '<div class="tai-list" style="max-width:300px">'+rows+'</div>'+
    '<div class="sub" style="margin:10px 0;line-height:1.6">正數=該收的點數<br>負數=該付的點數<br>（一點換算多少錢由你們自訂）</div>'+
    '<button class="go" id="btnFinalNew">重新開始（歸零分數）</button>';
  const b=$('btnFinalNew');
  if(b) b.onclick=()=>{ // 歸零重來
    if(G) G.players.forEach(p=>p.score=0);
    newGame(false);
  };
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================================================================
   連線：訂閱雲端遊戲狀態
   =================================================================== */
function subscribe(){
  dbRef('mahjong/rooms/'+ROOM+'/game').on('value', snap=>{
    const val=snap.val();
    if(val){
      G=val;
      // Firebase 不儲存空陣列、會把含 null 的陣列轉成物件 → 一律補齊還原成陣列
      G.deck = toArr(G.deck);
      if(!Array.isArray(G.players)) G.players = toArr(G.players);
      G.players.forEach(p=>{
        p.hand = toArr(p.hand);
        p.discards = toArr(p.discards);
        p.melds = toArr(p.melds);
        p.melds.forEach(m=>{ if(m) m.tiles = toArr(m.tiles); });
      });
      // 其餘可能被省略的欄位給預設值，避免 render 取用時崩潰
      if(G.lastDiscard===undefined) G.lastDiscard=null;
      if(G.pending===undefined) G.pending=null;
      if(G.result===undefined) G.result=null;
      if(G.winner===undefined) G.winner=null;
      if(typeof G.wallCount!=='number') G.wallCount = G.deck.length - (G.deckPos||0);
      if(G.finalScores) G.finalScores = toArr(G.finalScores);
      // 還原 pending 結構：Firebase 會把陣列/物件序列化變形，這裡修回乾淨格式
      if(G.pending){
        G.pending.responders = toArr(G.pending.responders).map(r=>{
          const can = r.can || {};
          if(can.chi) can.chi = toArr(can.chi).map(o=>toArr(o));  // chi 還原成二維陣列
          return { seat:r.seat, can };
        });
        G.pending.responses = G.pending.responses || {};
      }
      render();
      maybeAutoFlow();
      tryResolvePending();
      aiDriver();        // AI 主控檢查是否該幫電腦行動
    }
  });
  dbRef('mahjong/rooms/'+ROOM+'/names').on('value', snap=>{
    const v=snap.val(); if(v){ seatNames = toArr(v);
      if(G){ G.players.forEach((p,i)=>{ if(seatNames[i]) p.name=seatNames[i]; }); render(); } }
  });
}
/* 把 Firebase 可能回傳的 undefined / 物件 / 稀疏陣列，統一還原成乾淨陣列 */
function toArr(x){
  if(x===undefined || x===null) return [];
  if(Array.isArray(x)) return x.filter(v=>v!==null && v!==undefined);
  // Firebase 把陣列存成 {0:..,1:..} 物件時，依 key 排序還原
  if(typeof x==='object'){
    return Object.keys(x).sort((a,b)=>(+a)-(+b)).map(k=>x[k]).filter(v=>v!==null && v!==undefined);
  }
  return [];
}

function maybeAutoFlow(){
  if(!G||G.phase!=='playing'||mySeat<0) return;
  if(G.turn===mySeat && G.turnState==='draw'){
    // 自動摸牌，稍延遲讓畫面更新
    setTimeout(()=>{ if(G.turn===mySeat&&G.turnState==='draw') drawTile(mySeat); }, 500);
  }
}

/* ===================================================================
   入座 / 座位佔用 / 控制
   =================================================================== */

/* 開始監看某房間的座位狀態（入座前就能看到誰佔了哪格） */
let seatsSubscribed=false;
let watchedRoom=null;
function watchSeats(room){
  if(watchedRoom===room && seatsSubscribed) return; // 已在監看同一房
  ROOM=room; watchedRoom=room;
  dbRef('mahjong/rooms/'+ROOM+'/seats').on('value', snap=>{
    if(watchedRoom!==room) return; // 換房後忽略舊房回呼
    const v=snap.val();
    seats = v ? (Array.isArray(v)?v:[v[0]||null,v[1]||null,v[2]||null,v[3]||null]) : [null,null,null,null];
    while(seats.length<4) seats.push(null);
    renderSeatList();
    if(mySeat>=0 && (!seats[mySeat] || seats[mySeat].clientId!==clientId)){
      if(!seats[mySeat]){ forceLeave('座位已被清空，請重新入座'); }
    }
  });
  seatsSubscribed=true;
}

/* 渲染設定面板的座位卡片 */
function renderSeatList(){
  const list=$('seatList'); if(!list) return;
  list.querySelectorAll('.seat-card').forEach(card=>{
    const s=parseInt(card.dataset.seat,10);
    const o=seats[s];
    let stateEl=card.querySelector('.sc-state');
    // 用一個右側容器包 狀態文字 + (可能的)電腦代打按鈕
    let right=card.querySelector('.sc-right');
    if(!right){
      right=document.createElement('span'); right.className='sc-right';
      stateEl.parentNode.insertBefore(right, stateEl);
      right.appendChild(stateEl);
    }
    // 清掉舊的 AI 按鈕
    const oldBtn=right.querySelector('.sc-ai-btn'); if(oldBtn) oldBtn.remove();
    card.classList.remove('taken','selected','offline');

    const isAI = o && o.isAI;
    const occupiedByOther = o && o.clientId && !isAI && o.clientId!==clientId && Date.now()-(o.ts||0)<=OFFLINE_MS;

    if(isAI){
      stateEl.className='sc-state ai';
      stateEl.innerHTML='🤖 <b>'+escapeHtml(o.name||'電腦')+'</b>';
    }else if(occupiedByOther){
      card.classList.add('taken');
      stateEl.className='sc-state busy';
      stateEl.innerHTML='<b>'+escapeHtml(o.name||'玩家')+'</b>使用中';
    }else if(seatOffline(s)){
      card.classList.add('offline');
      stateEl.className='sc-state off';
      stateEl.innerHTML='<b>'+escapeHtml(o.name||'玩家')+'</b>已離線・可接手';
    }else if(o && o.clientId===clientId){
      stateEl.className='sc-state busy';
      stateEl.innerHTML='<b>你</b>已在此';
      if(s===selectedSeat) card.classList.add('selected');
    }else{
      stateEl.className='sc-state empty';
      stateEl.textContent='空位';
      if(s===selectedSeat) card.classList.add('selected');
    }

    // 空位或離線位 → 顯示「電腦代打」按鈕（讓真人可放電腦補位）
    if(!isAI && !occupiedByOther && !(o && o.clientId===clientId)){
      const b=document.createElement('button');
      b.className='sc-ai-btn'; b.textContent='電腦代打';
      b.onclick=(e)=>{ e.stopPropagation(); addAISeat(s); };
      right.appendChild(b);
    }
    // AI 座位 → 顯示「移除」按鈕
    if(isAI){
      const b=document.createElement('button');
      b.className='sc-ai-btn'; b.textContent='移除';
      b.onclick=(e)=>{ e.stopPropagation(); removeAISeat(s); };
      right.appendChild(b);
    }
  });
}

/* 在某座位放一個電腦 AI */
function addAISeat(s){
  const room=$('inpRoom').value.trim()||'mj001';
  ROOM=room; watchSeats(room);
  const names=['小電','阿福','機器人','電腦腦'];
  writeSeat(s, {clientId:'ai_'+s, name:names[s]||('電腦'+(s+1)), isAI:true, ts:Date.now()});
  // 同步寫入名字節點
  dbRef('mahjong/rooms/'+ROOM+'/names').once('value').then(snap=>{
    const c=snap.val(); const arr=c?(Array.isArray(c)?c:Object.values(c)):['','','',''];
    arr[s]=names[s]||('電腦'+(s+1)); while(arr.length<4)arr.push('');
    dbRef('mahjong/rooms/'+ROOM+'/names').set(arr);
  });
  toast('已在座位'+(s+1)+'放置電腦');
}

/* 移除某座位的電腦 */
function removeAISeat(s){
  if(!seats[s] || !seats[s].isAI) return;
  writeSeat(s, null);
  toast('已移除座位'+(s+1)+'的電腦');
}

/* 點座位卡片 */
function onSeatCardClick(s){
  if(seatOccupied(s)){ toast('此座位已有人使用'); return; }
  selectedSeat=s;
  renderSeatList();
}

function enterSeat(){
  const room=$('inpRoom').value.trim()||'mj001';
  const seat=selectedSeat;
  const name=($('inpName').value.trim()||('玩家'+(seat+1))).slice(0,6);
  if(seat<0){ toast('請先點選座位'); return; }
  // 讀取總局數設定
  const rsel=$('selRounds'); if(rsel) totalRounds=parseInt(rsel.value,10)||4;

  ROOM=room;
  watchSeats(room);  // 確保監看此房間座位
  // 搶位前再次確認最新狀態（避免兩人同時搶）
  dbRef('mahjong/rooms/'+ROOM+'/seats').once('value').then(snap=>{
    const v=snap.val();
    const cur = v ? (Array.isArray(v)?v:[v[0]||null,v[1]||null,v[2]||null,v[3]||null]) : [null,null,null,null];
    const o=cur[seat];
    const occupied = o && o.clientId && o.clientId!==clientId && (Date.now()-(o.ts||0)<=OFFLINE_MS);
    if(occupied){ toast('慢了一步，此座位剛被佔用'); seats=cur; renderSeatList(); return; }

    // 搶位成功 → 寫入座位、姓名
    mySeat=seat; myName=name;
    const now=Date.now();
    writeSeat(seat, {clientId, name, ts:now});
    // Firebase：斷線時自動清空此座位（比 beforeunload 可靠）
    if(useCloud){
      try{ db.ref('mahjong/rooms/'+ROOM+'/seats/'+seat).onDisconnect().remove(); }catch(e){}
    }

    seatNames[seat]=name;
    dbRef('mahjong/rooms/'+ROOM+'/names').once('value').then(s2=>{
      const c=s2.val(); const arr=c?(Array.isArray(c)?c:Object.values(c)):['','','',''];
      arr[seat]=name; while(arr.length<4)arr.push('');
      dbRef('mahjong/rooms/'+ROOM+'/names').set(arr);
    });

    $('setup').style.display='none';
    setConn(true);
    heartbeat();
    subscribe();

    dbRef('mahjong/rooms/'+ROOM+'/game').once('value').then(s3=>{
      toast(s3.val()? '已加入房間' : '已入座，按「新局」開始');
    });
  });
}

/* 自己離座（清掉自己那格） */
function leaveMySeat(){
  if(mySeat<0) return;
  writeSeat(mySeat, null);
}

/* 被迫回到設定面板 */
function forceLeave(msg){
  mySeat=-1; selectedSeat=-1;
  $('setup').style.display='flex';
  setConn(false);
  renderSeatList();
  if(msg) toast(msg, 2400);
}

/* 全部離座：清空整個 seats 節點（任何人都可按） */
function leaveAllSeats(){
  const room=$('inpRoom').value.trim()||ROOM||'mj001';
  ROOM=room;
  if(!confirm('確定清空全部座位嗎？\n所有人都將被請回入座畫面，需重新選位。')) return;
  dbRef('mahjong/rooms/'+ROOM+'/seats').set([null,null,null,null]);
  dbRef('mahjong/rooms/'+ROOM+'/heartbeat').set(null);
  // 自己也回到未入座
  mySeat=-1; selectedSeat=-1; setConn(false);
  $('setup').style.display='flex';
  toast('已清空全部座位', 2200);
}

function setConn(on){
  $('connDot').className='dot '+(on?'on':'off');
  $('connText').textContent = on ? (useCloud?'已連線':'本機模式') : '未連線';
}

/* ---------------- 綁定 ---------------- */
$('btnEnter').onclick=enterSeat;
$('btnSetup').onclick=()=>{ $('setup').style.display='flex'; selectedSeat=mySeat; watchSeats($('inpRoom').value.trim()||'mj001'); renderSeatList(); };
$('btnNew').onclick=()=>{
  if(mySeat<0){ toast('請先入座'); return; }
  newGame(false);
};
$('btnLeaveAll').onclick=leaveAllSeats;
$('btnMute').onclick=()=>{
  muted=!muted;
  $('btnMute').textContent = muted? '🔇 靜音' : '🔊 語音';
  if(muted && window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){}
  toast(muted? '已關閉語音' : '已開啟語音');
};
$('btnRefreshSeats').onclick=()=>{ watchSeats($('inpRoom').value.trim()||'mj001'); renderSeatList(); toast('已重新整理'); };
// 座位卡片點擊
document.querySelectorAll('#seatList .seat-card').forEach(card=>{
  card.addEventListener('click',()=>onSeatCardClick(parseInt(card.dataset.seat,10)));
});
// 換房間代碼時重新監看該房座位
$('inpRoom').addEventListener('change',()=>{ watchSeats($('inpRoom').value.trim()||'mj001'); });
// 自動帶入隨機名提示
$('inpName').addEventListener('focus',function(){ if(!this.value) this.placeholder='輸入姓名'; });
// 離開頁面時釋放座位
window.addEventListener('beforeunload',()=>{ if(mySeat>=0){ try{ dbRef('mahjong/rooms/'+ROOM+'/seats/'+mySeat).set(null); }catch(e){} } });

// 初始：先監看預設房間座位
setConn(false);
watchSeats('mj001');
renderSeatList();

/* ---------------- RWD：偵測視窗大小動態調整 ----------------
   1) 設定 --vh 變數解決手機瀏覽器網址列伸縮造成的高度誤差
   2) 視窗大小/方向改變時，重繪牌桌(讓依賴尺寸的版面即時校正) */
function applyViewport(){
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', vh+'px');
  const isPortrait = window.innerHeight > window.innerWidth;
  const isLandscape = !isPortrait;
  const isShortLandscape = isLandscape && window.innerHeight <= 560;  // 手機橫式(矮)
  const isNarrowPortrait = isPortrait && window.innerWidth <= 560;    // 手機直式(窄)
  document.body.dataset.orient = isPortrait ? 'portrait' : 'landscape';
  // 純自動套用版面（無手動按鈕）：
  //  手機直式 → compact(精簡)　手機橫式 → wide(寬敞)　其餘(平板/桌機) → 完整四方
  document.body.classList.toggle('compact', isNarrowPortrait);
  document.body.classList.toggle('wide', isShortLandscape);
}
applyViewport();
let _resizeTimer=null;
window.addEventListener('resize', ()=>{
  applyViewport();
  // 防抖：尺寸穩定後重繪一次，確保牌張寬度等重新計算
  clearTimeout(_resizeTimer);
  _resizeTimer=setTimeout(()=>{ if(G) try{ render(); }catch(e){} }, 150);
});
window.addEventListener('orientationchange', ()=>{
  setTimeout(()=>{ applyViewport(); if(G) try{ render(); }catch(e){} }, 200);
});

// 定期刷新座位卡片(讓離線判定的倒數即時更新)
setInterval(()=>{ if($('setup').style.display!=='none') renderSeatList(); }, 3000);
if(!useCloud){ $('setupHint').textContent='目前為本機模式（未設定 Firebase）：請在同一瀏覽器開 4 個分頁，房間代碼相同、各選不同座位即可連線測試。'; }

// 對外暴露（除錯）
window.__MJ_GAME = { get G(){return G;}, get seats(){return seats;}, newGame, mySeat:()=>mySeat,
  enterSeatProgrammatic:(s,n)=>{ selectedSeat=s; $('inpName').value=n; enterSeat(); },
  addAI:(s)=>addAISeat(s), removeAI:(s)=>removeAISeat(s), amController:()=>amAIController(),
  testDiscard:(seat,tile)=>{ G.turn=seat; G.turnState='discard'; discardTile(seat,tile); } };

})();
</script>
