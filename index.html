<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四人麻將・連線版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --felt:#0d5c3f;          /* 牌桌綠絨 */
    --felt-dark:#073d29;
    --felt-light:#147a52;
    --gold:#e8c468;
    --gold-deep:#b8902f;
    --tile-face:#fdfbf3;
    --tile-edge:#d9cfa8;
    --tile-back:#1d6b4a;
    --tile-back2:#0f4d33;
    --red:#c0392b;
    --ink:#2a2419;
    --panel:#1a1410;
    --panel-line:#3a2f22;
    --text:#f2ead6;
    --muted:#a99b7c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Noto Sans TC',sans-serif;
    /* 高度優先用動態視窗高度(手機網址列伸縮時自動校正)；舊瀏覽器退回 JS 設定的 --vh */
    height:100vh;
    height:calc(var(--vh, 1vh) * 100);
    height:100dvh;
    background:
      radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    color:var(--text);
    display:flex;flex-direction:column;
    user-select:none;
  }

  /* ---------- 頂部列 ---------- */
  #topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 14px;
    background:linear-gradient(180deg,#241c14,#1a1410);
    border-bottom:2px solid var(--gold-deep);
    box-shadow:0 2px 12px rgba(0,0,0,.5);
    flex-shrink:0;z-index:50;
  }
  #topbar .brand{
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;
    color:var(--gold);letter-spacing:2px;white-space:nowrap;
    text-shadow:0 1px 2px #000;
  }
  #topbar .roundinfo{font-size:12px;color:var(--muted);white-space:nowrap;}
  #topbar .roundinfo b{color:var(--gold);font-size:14px;}
  #topbar .spacer{flex:1;}
  #topbar select,#topbar input,#topbar button{
    font-family:inherit;font-size:13px;border-radius:6px;border:1px solid var(--panel-line);
    background:#2c2218;color:var(--text);padding:5px 8px;
  }
  #topbar select{min-width:120px;}
  #topbar input{width:90px;}
  #topbar button{
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    color:#2a1d05;font-weight:700;cursor:pointer;border:none;padding:6px 12px;
  }
  #topbar button:active{transform:translateY(1px);}
  #topbar button.ghost{background:#2c2218;color:var(--gold);border:1px solid var(--gold-deep);}

  /* ---------- 牌桌主區 ---------- */
  #table{
    flex:1;position:relative;overflow:hidden;
  }

  /* ---------- 中央棄牌集中區 ---------- */
  #discardZone{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:5;gap:2px;
    /* 限制在中央固定方框內，避免棄牌變多時往外擴張壓到四周的手牌/副露 */
    max-width:min(56vw,480px);
    max-height:min(52vh,420px);
  }
  #discardZone .dz-row{display:flex;justify-content:center;align-items:center;}
  #discardZone .dz-mid{display:flex;align-items:center;justify-content:center;gap:2px;}
  #discardZone .dz-side{display:flex;align-items:center;justify-content:center;}
  /* 各方向棄牌格：上下橫排、左右直排 */
  .dz-discards{display:grid;gap:2px;justify-content:center;align-content:center;}
  #dzBottom,#dzTop{grid-auto-flow:row;grid-template-columns:repeat(9,auto);}
  #dzLeft,#dzRight{grid-auto-flow:column;grid-template-rows:repeat(8,auto);}
  .dz-discards .tile{width:min(2.8vw,21px);height:min(4vw,30px);font-size:12px;opacity:.95;}
  /* 左右家棄牌轉 90 度，模擬從他們視角打出 */
  #dzLeft .tile{transform:rotate(90deg);}
  #dzRight .tile{transform:rotate(-90deg);}
  .dz-discards .tile.latest{box-shadow:0 0 0 2px var(--gold);opacity:1;}

  /* 中央資訊盤（縮小，讓周圍放棄牌） */
  #center{
    width:min(26vmin,190px);height:min(26vmin,190px);
    border-radius:14px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.04), rgba(0,0,0,.18)),
      var(--felt-dark);
    border:2px solid rgba(232,196,104,.35);
    box-shadow:inset 0 0 40px rgba(0,0,0,.5), 0 8px 30px rgba(0,0,0,.4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    flex-shrink:0;
  }
  #center .wall-count{font-size:12px;color:var(--muted);}
  #center .wall-count b{font-family:'Noto Serif TC',serif;font-size:24px;color:var(--gold);}
  #center .round-wind{
    font-family:'Noto Serif TC',serif;font-size:36px;font-weight:900;color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1;
  }
  #center .dealer-tag{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.3;}
  #center .dealer-tag .d-line{white-space:nowrap;}
  #center .last-discard{
    margin-top:2px;font-size:11px;color:var(--text);min-height:16px;text-align:center;
  }

  /* 四個座位區：往中央靠攏，縮小與中央間距 */
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:8;}
  /* 上下家不貼最邊，往中央收一些。限制最大高度，避免副露/手牌往中央侵入棄牌區 */
  .seat-bottom{bottom:6px;left:50%;transform:translateX(-50%);width:min(96vw,860px);max-height:22vh;}
  .seat-top{top:8px;left:50%;transform:translateX(-50%);width:min(80vw,640px);max-height:20vh;}
  /* 左右家往中央內推，限制最大寬度避免侵入中央 */
  .seat-left{left:0;top:50%;transform:translate(6%,-50%);max-width:18vw;}
  .seat-right{right:0;top:50%;transform:translate(-6%,-50%);max-width:18vw;}

  /* 玩家名牌 */
  .nameplate{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#2a2016,#1a1410);
    border:1px solid var(--panel-line);border-radius:20px;
    padding:3px 12px;font-size:13px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .nameplate.active{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(232,196,104,.4),0 0 16px rgba(232,196,104,.45);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{box-shadow:0 0 0 3px rgba(232,196,104,.6),0 0 22px rgba(232,196,104,.7);}}
  .nameplate .wind-badge{
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:15px;
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-deep));color:#2a1d05;flex-shrink:0;
  }
  .nameplate .pname{font-weight:700;color:var(--text);max-width:90px;overflow:hidden;text-overflow:ellipsis;}
  .nameplate .banker{color:var(--red);font-weight:900;font-size:12px;}
  .nameplate .score{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}
  .nameplate .hcount{display:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}

  /* ===== 橫式寬敞版（手機橫放自動套用 body.wide）=====
     只留自己手牌(放大)；對手收成頂部一條(名字+剩餘張數+輪到高亮)；
     中央只顯示最近打出的那張牌。整個畫面讓給自己的牌。 */
  #wideOppBar{display:none;}
  #wideWall{display:none;}
  body.wide #discardZone{ display:none; }                 /* 隱藏中央棄牌河與四方棄牌 */
  body.wide .seat-top, body.wide .seat-left, body.wide .seat-right{ display:none; }  /* 隱藏三家原座位 */
  /* 剩餘牌牆顯示(橫式時)放在左上角角落,不與中央打出的牌重疊 */
  body.wide #wideWall{
    display:block;position:absolute;top:8px;left:8px;right:auto;transform:none;
    z-index:14;font-size:12px;color:var(--gold);
    background:rgba(20,15,10,.7);padding:3px 10px;border-radius:8px;
    border:1px solid var(--gold-deep);font-variant-numeric:tabular-nums;
  }
  /* 頂部對手條 */
  body.wide #wideOppBar{
    display:flex;position:absolute;top:6px;left:50%;transform:translateX(-50%);
    gap:8px;z-index:15;justify-content:center;flex-wrap:wrap;
    width:max-content;max-width:calc(100vw - 160px);   /* 左右各預留 80px 給牌牆等元素 */
  }
  body.wide #wideOppBar .opp{
    display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:10px;
    background:rgba(20,15,10,.7);border:1px solid var(--panel-line);white-space:nowrap;
  }
  body.wide #wideOppBar .opp.active{
    border-color:var(--gold);background:rgba(60,46,26,.85);box-shadow:0 0 12px rgba(232,196,104,.5);
  }
  body.wide #wideOppBar .opp .wind-badge{
    width:20px;height:20px;border-radius:50%;background:var(--gold-deep);color:#2a1d05;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
  }
  body.wide #wideOppBar .opp .nm{color:var(--text);font-size:13px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;}
  body.wide #wideOppBar .opp .cnt{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums;}
  body.wide #wideOppBar .opp .bk{color:var(--red);font-size:11px;font-weight:900;}
  body.wide #wideOppBar .opp .sc{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}
  /* 中央最近打出的牌 */
  /* 「打出 X」框:跨版面通用,JS 會依版面定位到該玩家位置 */
  #wideLast{
    display:flex;flex-direction:row;align-items:center;gap:8px;
    position:absolute;top:calc(38% + 11px);left:50%;transform:translate(-50%,-50%);z-index:10;
    background:rgba(20,15,10,.7);padding:6px 14px;border-radius:12px;
    border:1px solid var(--gold-deep);
    width:max-content;            /* 避免被 transition 中的 top/bottom 撐大 */
    pointer-events:none;          /* 不擋下方按鈕的點擊 */
  }
  /* 橫式才用位置 transition;非橫式直接跳到新位置避免變形閃爍 */
  body.wide #wideLast{
    transition:top .35s ease, left .35s ease, right .35s ease, bottom .35s ease, transform .35s ease;
  }
  #wideLast .wl-label{color:var(--muted);font-size:13px;white-space:nowrap;}
  #wideLast .wl-tile .tile{ width:34px;height:48px;font-size:20px; }
  /* 直式精簡:背景更不透明 + 金色邊框 + 發光,讓打出的牌容易看清楚 */
  body.compact #wideLast{
    background:rgba(20,12,6,.95);
    border:2px solid var(--gold);
    box-shadow:0 4px 16px rgba(0,0,0,.7), 0 0 28px rgba(232,196,104,.5);
    padding:8px 16px;
  }
  body.compact #wideLast .wl-label{color:var(--gold);font-size:14px;font-weight:700;}

  /* 吃/碰/槓/胡 獨立發亮視窗 - 比 wideLast 更顯眼 */
  #wideAction{
    display:none;position:absolute;z-index:48;
    background:linear-gradient(180deg, rgba(232,196,104,.98), rgba(180,140,40,.98));
    color:#1a1004;font-family:'Noto Serif TC',serif;font-weight:900;
    border:3px solid #fff5d6;border-radius:14px;
    padding:8px 16px;
    box-shadow:0 0 0 4px rgba(0,0,0,.5),0 0 40px rgba(255,220,120,.9),0 8px 24px rgba(0,0,0,.6);
    text-align:center;
    pointer-events:none;opacity:0;
  }
  /* 不在 #wideAction 本身做位置 transition,避免「先在原處再滑到新位置」的閃跳 */
  #wideAction.show{display:block;opacity:1;animation:waPop .45s ease-out;}
  #wideAction .wa-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  #wideAction .wa-name{font-size:14px;color:#3a2410;}
  #wideAction .wa-verb{font-size:28px;line-height:1;text-shadow:0 2px 6px rgba(255,255,255,.6);}
  #wideAction .wa-tile{margin-top:4px;display:flex;justify-content:center;}
  #wideAction .wa-tile .tile{width:30px;height:42px;font-size:18px;}
  #wideAction.win{
    background:linear-gradient(180deg, #ff7563, #c0392b);
    color:#fff;border-color:#ffd5cf;
    box-shadow:0 0 0 4px rgba(0,0,0,.5),0 0 50px rgba(255,107,90,.9),0 8px 24px rgba(0,0,0,.6);
  }
  #wideAction.win .wa-name{color:#fff;}
  #wideAction.win .wa-verb{font-size:32px;text-shadow:0 2px 8px rgba(255,255,255,.4);}
  /* keyframes 只用 opacity + filter,不動 transform 避免覆蓋 JS 設的 transform */
  @keyframes waPop{
    0%  {opacity:0;filter:brightness(.6);}
    20% {opacity:1;filter:brightness(1.4);}
    100%{opacity:1;filter:brightness(1);}
  }
  /* 自己手牌置底:副露+手牌同一myrow,整體置中,副露有金邊背景與手牌視覺區分 */
  body.wide .seat-bottom{
    bottom:6px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 16px);
    max-height:none;align-items:center;
  }
  body.wide .seat-bottom .hand{
    --tw: min(40px, calc((92vw - 100px) / 17));
    gap:2px; padding:0 4px;
  }
  body.wide .myrow{ max-width:none; gap:8px; padding:0 4px; justify-content:center; align-items:center; }
  /* 操作按鈕(出 X)放在名牌右邊,跟名牌中心水平對齊 */
  body.wide #actions{
    left:auto;right:auto;transform:none;
    bottom:calc(min(40px, calc((92vw - 100px)/17)) * 1.4 + 11px);
    margin-left:160px;
    justify-content:flex-start;
    max-width:none;
    align-items:center;
  }
  /* 自己的副露:跟手牌同行(myrow),整組置中。副露在左、手牌在右,中間留間隔 */
  body.wide .seat-bottom .my-melds{
    background:rgba(60,46,26,.55);
    border:1px solid var(--gold-deep);
    border-radius:6px;
    padding:3px 5px;
    gap:3px;
    max-width:34vw;
    overflow-x:auto;overflow-y:hidden;
    flex-shrink:0;
  }
  body.wide .seat-bottom .meld{ padding:1px; background:transparent; }
  body.wide .seat-bottom .meld .tile{ width:18px;height:26px;font-size:11px; }
  /* 自己的名牌:絕對定位到左下角,不影響myrow置中 */
  /* 橫式:自己名牌獨立掛到 #table(不在 seat-bottom 裡),位置不受 seat-bottom 影響 */
  body.wide .my-nameplate-wide{
    position:absolute;left:8px;
    bottom:calc(min(40px, calc((92vw - 100px)/17)) * 1.4 + 6px);
    z-index:21;
    padding:3px 8px;font-size:11px;
    background:rgba(20,15,10,.85);
    border:1px solid var(--gold-deep);border-radius:6px;
  }
  body.wide .my-nameplate-wide .score{font-size:11px;}
  /* 舊的綁在 seat-bottom 內的規則先保留(直式精簡仍用) */

  /* 橫式螢幕矮：回應面板限制在上方+對手條下方的範圍,可捲動,避免按鈕被擠出畫面 */
  body.wide #respond{
    padding:10px 14px;gap:6px;min-width:auto;max-width:60vw;
    /* 貼右邊,不再置中 */
    top:54px;right:4px;left:auto;transform:none;
    max-height:calc((var(--vh,1vh) * 100) - 130px);  /* 上留54px、下留76px(自己手牌+空隙) */
    overflow-y:auto;overflow-x:hidden;
    /* 滾動條樣式更明顯 */
    scrollbar-width:thin;scrollbar-color:var(--gold) rgba(20,15,10,.5);
  }
  body.wide #respond::-webkit-scrollbar{width:8px;}
  body.wide #respond::-webkit-scrollbar-track{background:rgba(20,15,10,.5);border-radius:4px;}
  body.wide #respond::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:4px;}
  body.wide #respond::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  body.wide #respond .rtitle{font-size:14px;}
  body.wide #respond .rtile .tile{width:30px;height:42px;font-size:18px;}
  body.wide #respond .chi-opts{flex-direction:row;flex-wrap:wrap;gap:12px;justify-content:center;}
  body.wide #respond .chi-opt{
    padding:6px 8px;gap:2px;
    border:2px solid var(--gold-deep);          /* 明顯金邊讓組合區隔清楚 */
    background:rgba(60,46,26,.55);
    border-radius:8px;
    transition:transform .12s, border-color .12s, background .12s;
  }
  body.wide #respond .chi-opt:hover,
  body.wide #respond .chi-opt:active{
    border-color:var(--gold);background:rgba(90,68,38,.85);transform:translateY(-2px);
  }
  body.wide #respond .chi-opt .tile{width:24px;height:34px;font-size:14px;}
  body.wide .act-btn{font-size:14px;padding:7px 16px;}

  /* 對手副露彈窗(橫式時點對手條觸發) */
  #oppMeldPopup{
    display:none;position:absolute;inset:0;z-index:70;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.7);backdrop-filter:blur(3px);
  }
  /* 橫式:副露彈窗綁定對手位置(不再全螢幕遮罩),點背景關閉的功能要另外處理 */
  body.wide #oppMeldPopup{
    inset:auto;background:transparent;backdrop-filter:none;
    display:none;
  }
  body.wide #oppMeldPopup.show{display:block;}
  body.wide #oppMeldPopup .omp-card{
    box-shadow:0 0 0 4px rgba(0,0,0,.6),0 8px 28px rgba(0,0,0,.6),0 0 30px rgba(232,196,104,.4);
    padding:10px 14px;min-width:auto;
  }
  body.wide #oppMeldPopup .omp-title{font-size:14px;margin-bottom:6px;}
  body.wide #oppMeldPopup .omp-list{margin-bottom:6px;gap:6px;}
  body.wide #oppMeldPopup .omp-meld{padding:3px 5px;}
  body.wide #oppMeldPopup .omp-tiles .tile{width:18px;height:26px;font-size:11px;}
  body.wide #oppMeldPopup .omp-close{padding:5px 16px;font-size:12px;}
  #oppMeldPopup .omp-card{
    background:linear-gradient(180deg,#241a10,#15100a);
    border:2px solid var(--gold);border-radius:14px;padding:18px 22px;
    min-width:240px;max-width:92vw;text-align:center;box-shadow:0 0 40px rgba(232,196,104,.3);
  }
  #oppMeldPopup .omp-title{font-family:'Noto Serif TC',serif;font-size:18px;color:var(--gold);margin-bottom:12px;}
  #oppMeldPopup .omp-empty{color:var(--muted);font-size:14px;padding:14px 0;}
  #oppMeldPopup .omp-list{
    display:flex;flex-direction:row;flex-wrap:nowrap;gap:10px;
    justify-content:center;margin-bottom:12px;max-width:88vw;
    overflow-x:auto;overflow-y:hidden;
  }
  #oppMeldPopup .omp-meld{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 8px;background:rgba(60,46,26,.55);
    border:2px solid var(--gold-deep);border-radius:8px;
    flex-shrink:0;
  }
  #oppMeldPopup .omp-type{color:var(--gold);font-size:12px;font-weight:700;}
  #oppMeldPopup .omp-tiles{display:flex;gap:2px;}
  #oppMeldPopup .omp-tiles .tile{width:22px;height:32px;font-size:13px;}
  #oppMeldPopup .omp-close{
    margin-top:4px;padding:8px 24px;border-radius:8px;border:1px solid var(--gold-deep);
    background:#241a10;color:var(--gold);font-family:inherit;cursor:pointer;
  }
  body.wide #wideOppBar .opp.has-melds{ border-color:var(--gold-deep); }
  body.wide #wideOppBar .opp .ml{ color:#5fb98a; font-size:11px; }

  /* ===== 精簡模式（手機直式自動開啟）=====
     顯示對手牌背(小尺寸,有真實打牌感)+名牌+剩餘張數+副露，放大自己手牌 */
  body.compact .seat-top .oppbacks .tile.back{
    width:min(18px, calc((96vw - 30px) / 17));
    height:calc(min(18px, calc((96vw - 30px) / 17)) * 1.5);
  }
  body.compact .seat-left .oppbacks .tile.back,
  body.compact .seat-right .oppbacks .tile.back{ width:21px;height:15px; } /* 左右家牌背 */
  body.compact .nameplate .hcount{ display:inline; }       /* 同時顯示剩餘張數 */
  /* 上家:固定貼頂; 牌背在上,副露在牌背下方水平排列(對牌背置中) */
  body.compact .seat-top{ top:4px; max-height:30vh; flex-direction:column; align-items:center; width:100vw; }
  body.compact .seat-top .toprow{
    display:flex; flex-direction:column; align-items:center;   /* 改垂直堆疊:牌背上、副露下 */
    gap:4px; max-width:96vw;
  }
  body.compact .seat-top .oppbacks{ flex-wrap:nowrap; justify-content:center; max-width:98vw; overflow-x:auto; overflow-y:hidden; }
  body.compact .seat-top .melds{
    flex-direction:row; flex-wrap:wrap; justify-content:center;  /* 副露水平左到右、置中 */
    gap:4px;
  }
  body.compact .seat-top .meld .tile{ width:30px;height:44px;font-size:15px; }   /* 上家副露縮小 */
  /* 直式精簡:三家副露每組加金邊深色背景,跟自己副露一致 */
  body.compact .seat-top .meld,
  body.compact .seat-left .meld,
  body.compact .seat-right .meld{
    background:rgba(60,46,26,.7);
    border:1px solid var(--gold-deep);
    border-radius:5px;
    padding:2px 3px;
  }
  /* 左右兩家:放大空間以容納放大後的牌 */
  body.compact .seat-left, body.compact .seat-right{
    top:10%; bottom:auto; transform:none;
    max-width:90px; max-height:55vh;
    flex-direction:column; align-items:center;
    overflow-y:auto; overflow-x:hidden;
  }
  body.compact .seat-left{ left:2px; }
  body.compact .seat-right{ right:2px; }
  /* 左右家名牌:窄欄位放不下橫排,改成垂直排,每行一個資訊 */
  body.compact .seat-left .nameplate,
  body.compact .seat-right .nameplate{
    flex-direction:column; align-items:center; gap:2px;
    padding:4px 6px; font-size:11px; white-space:normal;
    line-height:1.2; max-width:60px;
  }
  body.compact .seat-left .nameplate .pname,
  body.compact .seat-right .nameplate .pname{
    font-size:11px; max-width:54px; overflow:hidden; text-overflow:ellipsis;
  }
  body.compact .seat-left .nameplate .hcount,
  body.compact .seat-right .nameplate .hcount,
  body.compact .seat-left .nameplate .score,
  body.compact .seat-right .nameplate .score{ font-size:10px; }
  /* 左右兩家副露:直排往下,進一步縮小避免侵入自己手牌 */
  body.compact .seat-left .melds, body.compact .seat-right .melds{
    flex-direction:column; flex-wrap:nowrap; transform:scale(.7); transform-origin:top center; gap:2px;
  }
  body.compact .seat-left .meld, body.compact .seat-right .meld{ flex-direction:row; }
  body.compact .seat-left .meld .tile,
  body.compact .seat-right .meld .tile{ width:30px;height:44px;font-size:15px; }   /* 左右家副露縮小 */
  /* 中央棄牌河、自己手牌 */
  body.compact #center{
    width:min(20vmin,100px);height:min(20vmin,100px);
    border-width:1px;padding:2px;
  }
  body.compact #center .round-wind{font-size:22px;}
  body.compact #center .wall-count{font-size:9px;}
  body.compact #center .wall-count b{font-size:14px;}
  body.compact #center .dealer-tag{font-size:9px;line-height:1.1;}
  body.compact .dz-discards .tile{ width:min(4.8vw,30px);height:min(6.6vw,44px); }
  /* 自己手牌:左右多留邊距,避免最邊牌貼邊或被光暈遮 */
  body.compact .seat-bottom{ width:92vw; bottom:12px; }
  /* 直式精簡:回應面板上移避免遮住手牌 */
  body.compact #respond{
    top:36%; padding:12px 16px; gap:6px;
  }
  body.compact #respond .rtitle{ font-size:14px; }
  body.compact #respond .rtile .tile{ width:32px;height:44px;font-size:18px; }
  body.compact #respond .chi-opt .tile{ width:26px;height:36px;font-size:14px; }
  body.compact .act-btn{ font-size:14px;padding:8px 18px; }
  body.compact .seat-bottom .hand{
    --tw: min(65px, calc((96vw - 30px) / 17));
    padding:0 6px;
  }
  /* 直式精簡:自己副露脫離 myrow,絕對定位到手牌上方並縮小,讓手牌獨享空間 */
  body.compact .seat-bottom .my-melds{
    position:absolute;
    left:50%;transform:translateX(-50%);
    bottom:calc(min(65px,calc((96vw - 30px)/17)) * 1.4 + 6px);  /* 緊貼手牌頂部上方一點(在「出X」按鈕下方) */
    z-index:18;
    background:rgba(60,46,26,.7);
    border:1px solid var(--gold-deep);
    border-radius:6px;
    padding:3px 5px;gap:3px;
    max-width:90vw;
    overflow-x:auto;overflow-y:hidden;
    flex-wrap:nowrap;
  }
  body.compact .seat-bottom .meld{ flex-shrink:0; padding:1px; background:transparent; }
  body.compact .seat-bottom .meld .tile{ width:20px;height:28px;font-size:11px; }   /* 自己副露縮小 */
  /* 直式精簡:myrow 不再含副露,純粹是手牌;z-index 高於副露 */
  body.compact .myrow{ justify-content:center; position:relative; z-index:19; }
  body.compact .seat-bottom .myhand{ position:relative; z-index:19; }

  /* ---------- 麻將牌通用樣式 ---------- */
  .tile{
    position:relative;border-radius:5px;flex-shrink:0;
    background:linear-gradient(160deg,#fff,var(--tile-face) 40%,var(--tile-edge));
    border:1px solid #c4b88e;
    box-shadow:0 2px 3px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.8);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC',serif;font-weight:700;line-height:1;
    color:var(--ink);overflow:hidden;
  }
  .tile .num{font-size:1.15em;}
  .tile.suit-m .num,.tile.honor-num{color:#1b2a4a;}
  .tile.suit-p{color:#0b6e4f;}
  .tile.suit-s{color:#0b6e4f;}
  .tile.red{color:var(--red)!important;}
  .tile .suit-label{position:absolute;bottom:2px;font-size:.5em;color:#888;letter-spacing:-1px;}

  /* SVG 圖形牌（筒/條）：讓 svg 置中填滿 */
  .tile.graphic{padding:0;}
  .tile.graphic svg{margin:auto;}

  /* 萬子：上中文數字、下「萬」字（仿真實牌的紅字款） */
  .tile .wan{display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1;gap:.04em;}
  .tile .wan-num{font-size:.62em;color:#1b2a4a;font-weight:700;}
  .tile .wan-word{font-size:.74em;color:var(--red);font-weight:900;}

  /* 牌背 */
  .tile.back{
    background:
      repeating-linear-gradient(45deg,var(--tile-back) 0 6px,var(--tile-back2) 6px 12px);
    border:1px solid #0a3d28;
    box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .tile.back::after{
    content:'';position:absolute;inset:18% 26%;
    border:1px solid rgba(232,196,104,.4);border-radius:3px;
  }

  /* 手牌（自己）大牌、可點
     寬度保證 17 張能塞進可用寬(約96vw)：每張 ≤ (96vw - 間距)/17
     同時不超過 46px；高度維持 ~1.4 比例。 */
  .seat-bottom .hand{ --tw: min(46px, calc((96vw - 70px) / 17)); padding:0 6px; }
  .seat-bottom .hand .tile{
    width:var(--tw); height:calc(var(--tw) * 1.4);
    font-size:calc(var(--tw) * 0.62);
    cursor:pointer;transition:transform .12s, box-shadow .12s;
  }
  /* 浮起只對真實滑鼠裝置生效;手機觸控不會卡在凸起狀態 */
  @media (hover:hover){
    .seat-bottom .hand .tile:hover{transform:translateY(-8px);box-shadow:0 8px 14px rgba(0,0,0,.4);}
  }
  .seat-bottom .hand .tile.selected{transform:translateY(-14px);box-shadow:0 0 0 2px var(--gold),0 10px 16px rgba(0,0,0,.5);}
  .seat-bottom .hand .tile.justdrawn{}
  .seat-bottom .hand .tile.canwin{box-shadow:0 0 0 2px var(--red),0 0 14px rgba(192,57,43,.6);}

  .hand{display:flex;gap:3px;align-items:flex-end;flex-wrap:nowrap;}

  /* 對家(上)小牌、牌背 */
  .seat-top .hand .tile,.seat-top .hand .tile.back{
    width:min(3.6vw,26px);height:min(5vw,36px);font-size:14px;
  }
  /* 左右家：旋轉的小牌 */
  .seat-left .hand,.seat-right .hand{flex-direction:column;}
  .seat-left .hand .tile,.seat-right .hand .tile{
    width:min(5vw,34px);height:min(3.4vw,24px);font-size:13px;
  }

  /* 副露區（吃碰槓亮牌） */
  .melds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px;}
  .meld{display:flex;gap:1px;padding:2px;background:rgba(0,0,0,.18);border-radius:4px;}
  .meld .tile{width:min(4vw,28px);height:min(5.6vw,40px);font-size:16px;}
  .seat-left .meld .tile,.seat-right .meld .tile{width:24px;height:34px;font-size:13px;}
  .seat-top .meld .tile{width:20px;height:28px;font-size:12px;}
  /* 左右兩家副露:由上往下垂直堆疊(不論完整或精簡版面) */
  .seat-left .melds, .seat-right .melds{
    flex-direction:column; flex-wrap:nowrap; align-items:center; gap:4px;
  }
  .seat-left .meld, .seat-right .meld{ flex-direction:row; }   /* 每組副露內部牌仍橫排 */
  /* 上家牌背與副露包進同一列容器 */
  .toprow{display:flex;align-items:flex-start;justify-content:center;gap:12px;max-width:100%;}
  .seat-bottom .melds{flex-wrap:nowrap;max-width:96vw;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;}
  .seat-bottom .meld{flex-shrink:0;}
  /* 自己：副露 + 手牌 同一水平列，副露靠左，與手牌之間留間隔 */
  .myrow{display:flex;align-items:flex-end;justify-content:center;gap:14px;max-width:98vw;}
  .myrow .my-melds{margin:0;flex-shrink:0;}      /* 副露靠左不被壓縮 */
  .myrow .hand{flex-shrink:1;}

  /* 棄牌河 */
  .discards{
    display:grid;grid-auto-flow:row;gap:2px;justify-content:center;
    margin-top:3px;max-width:100%;
  }
  .seat-bottom .discards{grid-template-columns:repeat(12,1fr);}
  .seat-top .discards{grid-template-columns:repeat(12,1fr);}
  .discards .tile{width:min(3.4vw,24px);height:min(4.8vw,34px);font-size:13px;opacity:.92;}
  .discards .tile.latest{box-shadow:0 0 0 2px var(--gold);opacity:1;}

  /* ---------- 操作列（自己回合的按鈕） ---------- */
  #actions{
    position:absolute;bottom:calc(min(10vw,64px) + 56px);left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:20;flex-wrap:wrap;justify-content:center;max-width:96vw;
  }
  /* 自己的名牌:絕對定位到「點手牌兩下出牌」按鈕的左邊(完整佈局與直式精簡共用) */
  body:not(.wide) .seat-bottom .nameplate{
    position:absolute;
    bottom:calc(min(10vw,64px) + 40px);
    right:calc(50% + 50px);
    z-index:21;
    background:rgba(20,15,10,.85);
  }
  .act-btn{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;
    padding:10px 20px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(180deg,#3a2c1c,#241a10);color:var(--gold);
    border:1px solid var(--gold-deep);box-shadow:0 4px 10px rgba(0,0,0,.4);
    transition:transform .1s;
  }
  .act-btn:active{transform:translateY(2px);}
  .act-btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#2a1d05;border:none;}
  .act-btn.win{background:linear-gradient(180deg,#e74c3c,#a93226);color:#fff;border:none;
    animation:winglow 1s infinite;}
  @keyframes winglow{50%{box-shadow:0 0 18px rgba(231,76,60,.8);}}
  .act-btn.pass{background:#241a10;color:var(--muted);border:1px solid var(--panel-line);}

  /* ---------- 回應面板（被詢問吃碰槓胡時） ---------- */
  #respond{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:60;display:none;flex-direction:column;align-items:center;gap:10px;
    background:linear-gradient(180deg,#2a1e14,#1a1208);
    border:2px solid var(--gold);border-radius:14px;padding:18px 22px;
    box-shadow:0 0 0 4px rgba(0,0,0,.4),0 16px 50px rgba(0,0,0,.6);
    min-width:280px;max-width:92vw;
  }
  #respond .rtitle{font-family:'Noto Serif TC',serif;font-size:17px;color:var(--gold);font-weight:700;}
  #respond .rtile{margin:2px 0;}
  #respond .rbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  #respond .chi-opts{display:flex;flex-direction:column;gap:6px;width:100%;}
  #respond .chi-opt{display:flex;gap:3px;justify-content:center;padding:6px;border-radius:8px;
    background:rgba(0,0,0,.25);cursor:pointer;border:1px solid transparent;}
  #respond .chi-opt:hover{border-color:var(--gold);}
  #respond .chi-opt .tile{width:32px;height:44px;font-size:18px;}
  /* 倒數計時:平常黃色,最後5秒變紅閃爍 */
  #respond .rcountdown{font-size:12px;color:var(--gold);margin-top:4px;font-variant-numeric:tabular-nums;}
  #respond .rcountdown.warn{color:#ff6b5a;animation:cdBlink .6s ease-in-out infinite;}
  @keyframes cdBlink{50%{opacity:.45;}}

  /* ---------- 結算彈窗 ---------- */
  #result{
    position:absolute;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.7);backdrop-filter:blur(3px);
  }
  #result .card{
    background:linear-gradient(180deg,#2a1e12,#16100a);
    border:2px solid var(--gold);border-radius:16px;padding:24px 28px;
    min-width:300px;max-width:92vw;max-height:88vh;overflow:auto;
    box-shadow:0 0 60px rgba(232,196,104,.3);text-align:center;
  }
  #result h2{font-family:'Noto Serif TC',serif;font-size:30px;color:var(--gold);margin-bottom:4px;}
  #result .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  #result .tai-list{text-align:left;margin:0 auto 14px;max-width:280px;}
  #result .tai-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--panel-line);font-size:14px;}
  #result .tai-row b{color:var(--gold);}
  #result .total{font-family:'Noto Serif TC',serif;font-size:24px;color:#fff;margin:10px 0;}
  #result .total b{color:var(--gold);font-size:34px;}
  #result .winhand{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
  #result .winhand .tile{width:30px;height:42px;font-size:18px;}

  /* ---------- 提示／訊息 ---------- */
  #toast{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    z-index:70;background:rgba(20,12,6,.92);border:1px solid var(--gold-deep);
    color:var(--gold);padding:8px 18px;border-radius:22px;font-size:14px;font-weight:700;
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;}

  /* 輪到自己：全螢幕邊框光暈 */
  #turnGlow{
    position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0;
    box-shadow:inset 0 0 0 3px var(--gold), inset 0 0 18px rgba(232,196,104,.4);
    transition:opacity .3s;
  }
  #turnGlow.show{opacity:1;animation:turnPulse 1.5s ease-in-out infinite;}
  @keyframes turnPulse{50%{box-shadow:inset 0 0 0 5px var(--gold), inset 0 0 30px rgba(232,196,104,.6);}}
  /* 換你了 橫幅 */
  #turnBanner{
    position:absolute;top:8%;left:12%;transform:translate(-50%,-50%) scale(.6);
    z-index:45;pointer-events:none;opacity:0;
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:min(10vw,52px);
    color:var(--gold);text-shadow:0 4px 20px rgba(0,0,0,.8),0 0 30px rgba(232,196,104,.6);
    white-space:nowrap;
  }
  /* 直式精簡:「換你了」往右移多一點(避開上家牌背左邊) */
  body.compact #turnBanner{ left:17%; }
  /* 完整佈局(非橫式非精簡):換你了再往左一點 */
  body:not(.wide):not(.compact) #turnBanner{ left:8%; }
  /* 非橫式:輪到自己出牌時持續脈動閃爍,直到出牌(setMyDiscardBanner 移除 show) */
  body:not(.wide) #turnBanner.show{animation:turnBannerPulse 1.2s ease-in-out infinite;}
  @keyframes turnBannerPulse{
    0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.95);}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
  }
  #turnBanner.show{animation:turnBannerPop 1.6s ease-out forwards;}
  @keyframes turnBannerPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
    30%{transform:translate(-50%,-50%) scale(1);}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  }
  /* 橫式:「換你了」改放畫面最左,輪到自己出牌時持續閃爍直到出牌 */
  body.wide #turnBanner{
    top:calc(30% + 2px);left:8px;transform:translateY(-50%);
    font-size:min(7vw,28px);letter-spacing:2px;
    color:var(--gold);text-shadow:0 0 12px rgba(232,196,104,.8);
    background:rgba(20,15,10,.7);padding:6px 12px;border-radius:8px;
    border:1px solid var(--gold);
  }
  body.wide #turnBanner.show{animation:wideMyTurn 1s ease-in-out infinite;}
  @keyframes wideMyTurn{
    0%,100%{opacity:.4;transform:translateY(-50%) scale(1);}
    50%{opacity:1;transform:translateY(-50%) scale(1.08);}
  }

  /* 「還沒輪到你出牌」提示:重疊在自己手牌位置,不擋其他畫面 */
  #notMyTurn{
    position:absolute;left:50%;bottom:18%;
    transform:translateX(-50%) scale(.9);
    z-index:35;pointer-events:none;opacity:0;
    background:rgba(192,57,43,.92);color:#fff;
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;
    padding:8px 18px;border-radius:10px;
    border:2px solid #fff5d6;
    box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 24px rgba(192,57,43,.6);
    white-space:nowrap;
    transition:opacity .2s, transform .2s;
  }
  #notMyTurn.show{opacity:1;transform:translateX(-50%) scale(1);}
  /* 橫式:重疊在自己手牌正中央 */
  body.wide #notMyTurn{
    bottom:calc(min(40px, calc((92vw - 100px)/17)) * 1.4 / 2 - 4px);
    font-size:16px;padding:6px 14px;
  }
  #actionFlash{
    position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.6);
    z-index:55;pointer-events:none;opacity:0;
    background:rgba(20,12,6,.9);border:3px solid var(--gold);border-radius:18px;
    padding:14px 28px;box-shadow:0 0 50px rgba(232,196,104,.5),0 0 0 6px rgba(0,0,0,.4);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-family:'Noto Serif TC',serif;color:var(--gold);text-align:center;
  }
  #actionFlash .af-name{font-size:min(5vw,22px);color:var(--text);font-weight:700;}
  #actionFlash .af-act{font-size:min(13vw,64px);font-weight:900;line-height:1;
    text-shadow:0 4px 20px rgba(0,0,0,.8),0 0 30px rgba(232,196,104,.6);}
  #actionFlash .af-act.af-win{color:#ff6b5a;}
  #actionFlash .af-tile{font-size:min(6vw,28px);font-weight:700;}
  #actionFlash .af-tai{font-size:min(4vw,18px);color:var(--text);}
  #actionFlash.show{animation:actionFlashPop 1.8s ease-out forwards;}
  @keyframes actionFlashPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    25%{transform:translate(-50%,-50%) scale(1);}
    80%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.95);}
  }
  /* 橫式專用:玩家旁邊的動作徽章(取代中央大字彈窗,綁定到玩家位置) */
  .action-badge{
    display:flex;align-items:center;gap:4px;

  @media (max-width:560px){

  @media (min-width:561px) and (min-height:561px){

<script>
/* ===================================================================
   台灣麻將核心引擎 (engine.js)
   純邏輯，無 DOM、無 Firebase，可用 Node 直接測試。
   牌的編碼：
     萬 m1..m9   筒 p1..p9   條 s1..s9
     字 z1=東 z2=南 z3=西 z4=北 z5=中 z6=發 z7=白
   一副 = 每種 4 張 = (9*3 + 7) * 4 = 136 張
   =================================================================== */

(function (root) {
  'use strict';

  // ---------- 牌堆生成 ----------
  const SUITS = ['m', 'p', 's'];
  const HONORS = ['z1','z2','z3','z4','z5','z6','z7'];
  const WINDS  = ['z1','z2','z3','z4'];          // 東南西北
  const DRAGONS= ['z5','z6','z7'];               // 中發白

  function buildWall() {
    const wall = [];
    for (const suit of SUITS)
      for (let n = 1; n <= 9; n++)
        for (let c = 0; c < 4; c++) wall.push(suit + n);
    for (const h of HONORS)
      for (let c = 0; c < 4; c++) wall.push(h);
    return wall; // 136
  }

  // Fisher-Yates 洗牌，可帶入 seed 以便重現測試
  function shuffle(arr, rng) {
    rng = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 可重現亂數 (mulberry32)
  function makeRng(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- 工具：把手牌轉成計數物件 ----------
  function toCounts(tiles) {
    const c = {};
    for (const t of tiles) c[t] = (c[t] || 0) + 1;
    return c;
  }
  function tileType(t) { return t[0]; }            // 'm','p','s','z'
  function tileNum(t) { return parseInt(t.slice(1), 10); }
  function isHonor(t) { return t[0] === 'z'; }
  function isSuited(t) { return t[0] !== 'z'; }

  // 排序：方便顯示與比對
  const TYPE_ORDER = { m: 0, p: 1, s: 2, z: 3 };
  function sortTiles(tiles) {
    return tiles.slice().sort((a, b) => {
      if (TYPE_ORDER[a[0]] !== TYPE_ORDER[b[0]]) return TYPE_ORDER[a[0]] - TYPE_ORDER[b[0]];
      return tileNum(a) - tileNum(b);
    });
  }

  // ===================================================================
  //  核心：判斷一組「純手牌」(不含已亮出的吃碰槓) 能否組成
  //  needSets 組面子 + 1 對眼。 台灣麻將胡牌 = 16+1 張中，
  //  扣掉已露出的副露後，剩餘手牌要湊滿總共 5 面子 + 1 眼。
  //  這裡用遞迴：先抽眼，再貪心拆面子。
  // ===================================================================

  // 嘗試把 counts 拆成 setsNeeded 個面子 (刻子或順子)，無眼。
  function canFormMelds(counts, setsNeeded) {
    if (setsNeeded === 0) {
      // 所有牌必須用完
      for (const k in counts) if (counts[k] > 0) return false;
      return true;
    }
    // 找到第一張還有的牌
    let first = null;
    for (const t of ALL_TILES) {
      if (counts[t] > 0) { first = t; break; }
    }
    if (first === null) return false;

    // 嘗試刻子
    if (counts[first] >= 3) {
      counts[first] -= 3;
      if (canFormMelds(counts, setsNeeded - 1)) { counts[first] += 3; return true; }
      counts[first] += 3;
    }
    // 嘗試順子 (只限數牌且 num<=7)
    if (isSuited(first)) {
      const n = tileNum(first), s = tileType(first);
      const t2 = s + (n + 1), t3 = s + (n + 2);
      if (n <= 7 && counts[t2] > 0 && counts[t3] > 0) {
        counts[first]--; counts[t2]--; counts[t3]--;
        if (canFormMelds(counts, setsNeeded - 1)) { counts[first]++; counts[t2]++; counts[t3]++; return true; }
        counts[first]++; counts[t2]++; counts[t3]++;
      }
    }
    return false;
  }

  // 固定的全牌列舉順序（給 canFormMelds 用）
  const ALL_TILES = (function () {
    const a = [];
    for (const s of SUITS) for (let n = 1; n <= 9; n++) a.push(s + n);
    for (const h of HONORS) a.push(h);
    return a;
  })();

  // 判斷 handTiles (純手牌陣列) + 已露出 meldCount 組，是否胡牌。
  // 台灣麻將：總共需要 5 個面子 + 1 眼。
  // handTiles 張數應為 (5 - meldCount)*3 + 2。
  function isWinningHand(handTiles, meldCount) {
    const setsNeeded = 5 - meldCount;
    const need = setsNeeded * 3 + 2;
    if (handTiles.length !== need) return false;
    const counts = toCounts(handTiles);
    // 枚舉眼
    for (const t of ALL_TILES) {
      if ((counts[t] || 0) >= 2) {
        counts[t] -= 2;
        if (canFormMelds(counts, setsNeeded)) { counts[t] += 2; return true; }
        counts[t] += 2;
      }
    }
    return false;
  }

  // 判斷是否聽牌：手牌差一張即可胡。回傳可胡的牌陣列（可能多張）。
  // handTiles = 純手牌（張數 = (5-meldCount)*3 + 1，即未摸/未吃碰時的等待狀態）
  function getWaits(handTiles, meldCount) {
    const waits = [];
    for (const t of ALL_TILES) {
      // 該牌不能已經有 4 張（含手牌）
      const test = handTiles.concat([t]);
      if (toCounts(test)[t] > 4) continue;
      if (isWinningHand(test, meldCount)) waits.push(t);
    }
    return waits;
  }

  // ===================================================================
  //  吃碰槓的合法性判斷
  // ===================================================================
  // 是否可碰：手中有該牌 >= 2
  function canPong(handTiles, tile) {
    return toCounts(handTiles)[tile] >= 2;
  }
  // 是否可明槓（大明槓）：手中有該牌 >= 3
  function canKong(handTiles, tile) {
    return toCounts(handTiles)[tile] >= 3;
  }
  // 暗槓：手中某牌 == 4
  function getConcealedKongs(handTiles) {
    const c = toCounts(handTiles), res = [];
    for (const k in c) if (c[k] === 4) res.push(k);
    return res;
  }
  // 加槓：已碰的牌再摸到第 4 張
  function canAddKong(handTiles, melds, tile) {
    if (toCounts(handTiles)[tile] < 1) return false;
    return melds.some(m => m.type === 'pong' && m.tile === tile);
  }
  // 吃：只能吃上家，且為數牌。回傳所有可吃的組合（每組是兩張手牌）
  function getChiOptions(handTiles, tile) {
    if (isHonor(tile)) return [];
    const s = tileType(tile), n = tileNum(tile);
    const has = (x) => toCounts(handTiles)[s + x] > 0;
    const opts = [];
    // tile 當最小：tile, n+1, n+2
    if (n <= 7 && has(n + 1) && has(n + 2)) opts.push([s + (n + 1), s + (n + 2)]);
    // tile 當中間：n-1, tile, n+1
    if (n >= 2 && n <= 8 && has(n - 1) && has(n + 1)) opts.push([s + (n - 1), s + (n + 1)]);
    // tile 當最大：n-2, n-1, tile
    if (n >= 3 && has(n - 1) && has(n - 2)) opts.push([s + (n - 2), s + (n - 1)]);
    return opts;
  }

  // ===================================================================
  //  台數計算
  //  輸入：完整的「胡牌結構」context，輸出 { total, items:[{name,tai}] }
  //  context = {
  //    handTiles,      // 胡牌當下的純手牌（含贏的那張）
  //    melds,          // [{type:'chi'|'pong'|'kong'|'ankong'|'addkong', tile, tiles:[...]}]
  //    winTile,        // 贏的那張
  //    selfDraw,       // 是否自摸
  //    seatWind,       // 'z1'..'z4'   門風
  //    roundWind,      // 'z1'..'z4'   圈風
  //    isBanker,       // 是否莊家
  //    bankerStreak,   // 連莊數（含本局），0 表示非連莊
  //    isLastTile,     // 海底撈月 / 河底撈魚
  //    isRobKong,      // 搶槓
  //    afterKong,      // 槓上開花
  //    firstDraw,      // 天胡/地胡判斷用：是否第一巡未經吃碰
  //    isHeavenly,     // 天胡（莊家起手胡）
  //    isEarthly,      // 地胡（閒家第一摸胡）
  //    concealed,      // 是否門清（無吃碰明槓，暗槓可允許依規則，這裡門清=無任何露出非暗槓）
  //  }
  // ===================================================================

  // 把 melds 還原成完整 34 計數，方便番種判斷
  function fullCounts(handTiles, melds) {
    const c = toCounts(handTiles);
    for (const m of melds) {
      for (const t of m.tiles) c[t] = (c[t] || 0) + 1;
    }
    return c;
  }
  function allTilesFlat(handTiles, melds) {
    let arr = handTiles.slice();
    for (const m of melds) arr = arr.concat(m.tiles);
    return arr;
  }

  // 將「純手牌」分解成面子結構（回傳一種可行分解：{pair, sets:[[t,t,t]...]}）
  function decompose(handTiles, setsNeeded) {
    const counts = toCounts(handTiles);
    for (const eye of ALL_TILES) {
      if ((counts[eye] || 0) >= 2) {
        counts[eye] -= 2;
        const sets = [];
        if (collectMelds(counts, setsNeeded, sets)) {
          counts[eye] += 2;
          return { pair: eye, sets: sets.slice() };
        }
        counts[eye] += 2;
      }
    }
    return null;
  }
  function collectMelds(counts, need, out) {
    if (need === 0) {
      for (const k in counts) if (counts[k] > 0) return false;
      return true;
    }
    let first = null;
    for (const t of ALL_TILES) if (counts[t] > 0) { first = t; break; }
    if (first === null) return false;
    if (counts[first] >= 3) {
      counts[first] -= 3; out.push([first, first, first]);
      if (collectMelds(counts, need - 1, out)) { counts[first] += 3; return true; }
      out.pop(); counts[first] += 3;
    }
    if (isSuited(first)) {
      const n = tileNum(first), s = tileType(first);
      const t2 = s + (n + 1), t3 = s + (n + 2);
      if (n <= 7 && counts[t2] > 0 && counts[t3] > 0) {
        counts[first]--; counts[t2]--; counts[t3]--;
        out.push([first, t2, t3]);
        if (collectMelds(counts, need - 1, out)) { counts[first]++; counts[t2]++; counts[t3]++; return true; }
        out.pop(); counts[first]++; counts[t2]++; counts[t3]++;
      }
    }
    return false;
  }

  function scoreWin(ctx) {
    const items = [];
    const add = (name, tai) => { if (tai > 0) items.push({ name, tai }); };

    const melds = ctx.melds || [];
    const handTiles = ctx.handTiles;
    const setsNeeded = 5 - melds.length;
    const decomp = decompose(handTiles, setsNeeded); // 純手牌分解
    const all = allTilesFlat(handTiles, melds);
    const fc = fullCounts(handTiles, melds);
    const flatTypes = new Set(all.map(tileType));

    // ---- 基本台 ----
    // 莊家 / 連莊
    if (ctx.isBanker) {
      add('莊家', 1);
      if (ctx.bankerStreak && ctx.bankerStreak > 0) add('連莊拉莊', ctx.bankerStreak * 2);
    }

    // 自摸
    if (ctx.selfDraw) add('自摸', 1);

    // 門清（無吃、無碰、無大明槓；暗槓不破壞門清）
    const hasExposed = melds.some(m => m.type === 'chi' || m.type === 'pong' || m.type === 'kong' || m.type === 'addkong');
    if (!hasExposed) {
      add('門清', 1);
      if (ctx.selfDraw) add('門清自摸', 1); // 門清自摸再 +1（合計常見算法）
    }
    // 不求人（門清自摸）已包含於上；某些規則另計，這裡併入。

    // 圈風 / 門風 刻子（含字一色判斷用）
    function hasTripletOf(tile) {
      // 在手牌分解的 sets 或 melds 中是否有該牌刻子/槓
      if (decomp) {
        for (const st of decomp.sets) if (st[0] === tile && st[1] === tile && st[2] === tile) return true;
      }
      for (const m of melds) {
        if ((m.type === 'pong' || m.type === 'kong' || m.type === 'ankong' || m.type === 'addkong') && m.tile === tile) return true;
      }
      return false;
    }
    if (hasTripletOf(ctx.roundWind)) add('圈風', 1);
    if (hasTripletOf(ctx.seatWind)) add('門風', 1);
    for (const d of DRAGONS) if (hasTripletOf(d)) add('三元牌(' + zhTile(d) + ')', 1);

    // ---- 牌型台 ----
    // 碰碰胡：5 組皆刻（或槓），眼一對
    const allTriplet = (() => {
      if (!decomp) {
        // 沒有純手牌分解（理論上不會），保守 false
        return false;
      }
      const handAllTrip = decomp.sets.every(st => st[0] === st[1] && st[1] === st[2]);
      const meldAllTrip = melds.every(m => m.type !== 'chi');
      return handAllTrip && meldAllTrip;
    })();
    if (allTriplet) add('碰碰胡', 4);

    // 平胡：全順子、無字、眼非三元/風、非自摸（傳統定義較嚴，這裡簡化：全順+無字）
    const allSequence = (() => {
      if (!decomp) return false;
      const handAllSeq = decomp.sets.every(st => !(st[0] === st[1] && st[1] === st[2]));
      const meldAllSeq = melds.every(m => m.type === 'chi');
      return handAllSeq && meldAllSeq && !flatTypes.has('z');
    })();
    if (allSequence && !allTriplet) add('平胡', 2);

    // 清一色 / 混一色 / 字一色
    const suitTypes = new Set(all.filter(isSuited).map(tileType));
    const hasHonor = flatTypes.has('z');
    if (suitTypes.size === 0 && hasHonor) {
      add('字一色', 16);
    } else if (suitTypes.size === 1 && !hasHonor) {
      add('清一色', 8);
    } else if (suitTypes.size === 1 && hasHonor) {
      add('混一色', 4);
    }

    // 三元/小三元/大三元
    const dragonTrip = DRAGONS.filter(hasTripletOf).length;
    const dragonPair = decomp && DRAGONS.includes(decomp.pair) ? 1 : 0;
    if (dragonTrip === 3) add('大三元', 8);
    else if (dragonTrip === 2 && dragonPair === 1) add('小三元', 4);

    // 四喜
    const windTrip = WINDS.filter(hasTripletOf).length;
    const windPair = decomp && WINDS.includes(decomp.pair) ? 1 : 0;
    if (windTrip === 4) add('大四喜', 16);
    else if (windTrip === 3 && windPair === 1) add('小四喜', 8);

    // 槓相關
    const kongs = melds.filter(m => m.type === 'kong' || m.type === 'ankong' || m.type === 'addkong');
    const ankongCount = melds.filter(m => m.type === 'ankong').length;
    if (kongs.length === 1) add('槓', 1);
    else if (kongs.length === 2) add('雙槓', 2);
    else if (kongs.length === 3) add('三槓', 8);
    else if (kongs.length === 4) add('四槓', 16);
    if (ankongCount === 1 && kongs.length === 1) {/* 已計槓，暗槓加成併入規則差異，從略 */}

    // 全求人（單吊 + 全部副露 + 食胡）—簡化略過避免誤判

    // ---- 特殊狀況台 ----
    if (ctx.afterKong) add('槓上開花', 1);
    if (ctx.isRobKong) add('搶槓', 1);
    if (ctx.isLastTile && ctx.selfDraw) add('海底撈月', 1);
    if (ctx.isLastTile && !ctx.selfDraw) add('河底撈魚', 1);
    if (ctx.isHeavenly) add('天胡', 24);
    if (ctx.isEarthly) add('地胡', 16);

    // 獨聽 / 單吊（眼）— 偵測：贏的那張正好補成眼
    // 簡化：若 winTile 等於 decomp.pair 且原手只有一張 → 單吊
    // （需要更精準需傳入聽牌前狀態，這裡略過避免誤差）

    // 花台不在本引擎（未實作花牌），略。

    const total = items.reduce((s, it) => s + it.tai, 0);
    return { total, items };
  }

  // 中文牌名
  function zhTile(t) {
    if (t[0] === 'm') return t[1] + '萬';
    if (t[0] === 'p') return t[1] + '筒';
    if (t[0] === 's') return t[1] + '條';
    const map = { z1: '東', z2: '南', z3: '西', z4: '北', z5: '中', z6: '發', z7: '白板' };
    return map[t] || t;
  }

  const API = {
    buildWall, shuffle, makeRng, toCounts, sortTiles, zhTile,
    isWinningHand, getWaits, canPong, canKong, getConcealedKongs,
    canAddKong, getChiOptions, decompose, scoreWin,
    WINDS, DRAGONS, ALL_TILES,
    tileType, tileNum, isHonor, isSuited
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.MJ = API;

})(typeof window !== 'undefined' ? window : globalThis);

// 筒子 SVG

    red:{outer:'#e8e4d4',ring:'#b8342a',inner:'#c0392b',core:'#f4e8d0'},
    green:{outer:'#e8e4d4',ring:'#0c6e4a',inner:'#0f7a52',core:'#f4e8d0'},
    blue:{outer:'#e8e4d4',ring:'#1b4a7a',inner:'#1f5a8c',core:'#f4e8d0'},
  };
  let body='';

      '<circle cx="50" cy="70" r="36" fill="#e8e4d4" stroke="#0c6e4a" stroke-width="3.5"/>'+
      '<circle cx="50" cy="70" r="27" fill="none" stroke="#b8342a" stroke-width="3.5"/>'+
      '<circle cx="50" cy="70" r="18" fill="#1f5a8c"/>'+
      '<circle cx="50" cy="70" r="9" fill="#e8e4d4"/>'+
      '<circle cx="50" cy="70" r="4" fill="#b8342a"/>';
  }else{
    const r = n<=4?14: n<=6?13: 11;
    layout.forEach((p,i)=>{

      body+=pinDot(p[0],p[1],r,pal);

  return svgWrap(body);
}

// 條子 SVG
function buildBambooSVG(n){
  if(n===1) return buildBird();
  const layout=BAMBOO_LAYOUTS[n];
  const greens=['#0f7a52','#c0392b','#1f5a8c'];
  let body='';

  });
  return svgWrap(body);
}

function svgWrap(inner){

    'style="width:84%;height:84%;display:block">'+inner+'</svg>';
}

/* ===================================================================
   遊戲流程（權威端：由「當前 turn 的座位的客戶端」執行狀態變更後寫雲端）
   為避免衝突，採「行動者寫入」：誰行動誰更新 G。
   =================================================================== */

function newGame(keepDealer){
  const seed = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  const rng = MJ.makeRng(seed);
  const deck = MJ.shuffle(MJ.buildWall(), rng);

  const prev = G;
  let dealer = 0, roundWind = 'z1', bankerStreak = 0;
  const scores = [0,0,0,0];   // 新局預設分數歸零
  if(prev && keepDealer){
    // 僅「同一盤內續局」(流局續莊等)才沿用莊位與累積分數
    dealer = prev.dealer; roundWind = prev.roundWind; bankerStreak = prev.bankerStreak;
    for(let i=0;i<4;i++) scores[i]=prev.players[i].score;
  }
  // 否則(按「新局」開全新一盤)：分數歸零、座位0起莊、東圈

  // 發牌：每家16張，莊家17張
  const players = [];
  let pos = 0;
  for(let s=0;s<4;s++){
    const hand=[];
    for(let k=0;k<16;k++) hand.push(deck[pos++]);
    players.push({
      name: seatNames[s]||('玩家'+(s+1)),
      score: scores[s],
      hand: MJ.sortTiles(hand),
      melds: [],
      discards: [],
      wind: WINDS[(s - dealer + 4) % 4],  // 莊為東，逆時針排門風
      connected: true,
    });
  }
  // 莊家補第17張
  const dealerDraw = deck[pos++];
  players[dealer].hand = MJ.sortTiles(players[dealer].hand.concat([dealerDraw]));

  G = {
    phase:'playing',
    roundWind, dealer, bankerStreak,
    roundNo: 1,                          // 全新一局從第1局開始
    totalRounds: totalRounds,            // 總局數設定
    turn: dealer,
    turnState: 'discard',     // 莊家先打
    players,
    lastDiscard: null,
    pending: null,
    justDrawn: dealerDraw,
    deck, deckPos: pos,
    wallCount: deck.length - pos,
    log: WIND_ZH[roundWind]+'圈・'+players[dealer].name+' 坐莊，請出牌',
    winner: null, result: null,
    seed,
    ts: Date.now(),
  };
  pushG();
  speak(players[dealer].name+'坐莊');
}

/* Firebase 不接受 undefined（會導致整包 set 失敗）。
   深層清掉 undefined：物件刪除該鍵、陣列轉為 null。 */
function sanitizeForFirebase(obj){
  if(obj===undefined) return null;
  if(obj===null || typeof obj!=='object') return obj;
  if(Array.isArray(obj)) return obj.map(v=> v===undefined? null : sanitizeForFirebase(v));
  const out={};
  for(const k in obj){
    if(obj[k]===undefined) continue;
    out[k]=sanitizeForFirebase(obj[k]);
  }
  return out;
}

/* 寫入雲端（全狀態） */
function pushG(){
  G.ts = Date.now();
  const safe = sanitizeForFirebase(G);
  const p = dbRef('mahjong/rooms/'+ROOM+'/game').set(safe);
  if(useCloud && p && p.catch){
    p.catch(err=>{
      console.error('雲端寫入失敗:', err);
      toast('雲端寫入失敗，請檢查 Firebase 規則', 3000);
    });
  }
}
/* 寫入/更新單一座位（讀回整個陣列改該格再寫回，確保 localStorage 模式也能同步） */
function writeSeat(seat, val){
  return dbRef('mahjong/rooms/'+ROOM+'/seats').once('value').then(snap=>{
    const v=snap.val();
    const arr = v ? (Array.isArray(v)?v.slice():[v[0]||null,v[1]||null,v[2]||null,v[3]||null]) : [null,null,null,null];
    while(arr.length<4) arr.push(null);
    arr[seat]=val;
    return dbRef('mahjong/rooms/'+ROOM+'/seats').set(arr);
  });
}

/* 精準心跳（不覆蓋遊戲狀態）：同時更新自己座位的存活時間戳 */
function heartbeat(){
  if(mySeat<0) return;
  const now=Date.now();
  dbRef('mahjong/rooms/'+ROOM+'/heartbeat/'+mySeat).set({clientId, ts:now});
  // 更新自己座位 ts，證明還在線
  writeSeat(mySeat, {clientId, name:myName, ts:now});
}
setInterval(heartbeat, 5000);

/* ---------------- 摸牌 ---------------- */
function drawTile(seat){
  if(G.deckPos >= G.deck.length){ // 流局
    G.phase='over'; G.log='牌牆已盡，本局流局';
    G.result={draw:true};
    pushG(); speak('流局'); return;
  }
  const t = G.deck[G.deckPos++];
  G.players[seat].hand = MJ.sortTiles(G.players[seat].hand.concat([t]));
  G.justDrawn = t;
  G.wallCount = G.deck.length - G.deckPos;
  G.turnState = 'discard';
  // 注意:刻意不清 G.lastDiscard,讓「上一家打出的牌」保留在中央顯示,
  // 直到本家打牌時自然覆蓋,避免「剛打出就被下家摸牌清空、看不到」的閃現問題
  G.log = G.players[seat].name+' 摸牌';
  // 自摸判斷由該玩家 UI 處理（顯示胡按鈕）
  pushG();
}

/* ---------------- 打牌 ---------------- */
function discardTile(seat, tile){
  const p = G.players[seat];
  const i = p.hand.indexOf(tile);
  if(i<0){ toast('沒有這張牌'); return; }
  p.hand.splice(i,1);
  p.hand = MJ.sortTiles(p.hand);
  p.discards.push(tile);
  G.lastDiscard = {seat, tile};
  G.justDrawn = null;
  G.log = p.name+' 打出 '+MJ.zhTile(tile);
  G.actionFlash = {type:'discard', seat, tile, name:p.name, ts:Date.now()};

  // 詢問其他三家是否要 吃/碰/槓/胡
  const responders = computeResponders(seat, tile);
  if(responders.length>0){
    G.turnState='respond';
    G.pending = { tile, from:seat, responders, responses:{}, order: responders.map(r=>r.seat) };
  }else{
    // 無人可回應，輪到下家摸牌
    nextTurnDraw(seat);
  }
  pushG();
  speak(p.name+'打'+MJ.zhTile(tile));
}

/* 計算可回應者（胡>碰槓>吃，吃僅限下家） */
function computeResponders(fromSeat, tile){
  const res=[];
  for(let s=0;s<4;s++){
    if(s===fromSeat) continue;
    const p=G.players[s];
    const opts={seat:s, can:{}};
    // 胡（食胡）：手牌+該張 是否胡
    const meldCount = p.melds.length;
    if(MJ.isWinningHand(p.hand.concat([tile]), meldCount)) opts.can.win=true;
    // 碰
    if(MJ.canPong(p.hand, tile)) opts.can.pong=true;
    // 明槓
    if(MJ.canKong(p.hand, tile)) opts.can.kong=true;
    // 吃（僅下家）
    const isNext = ((fromSeat+1)%4)===s;
    if(isNext){ const c=MJ.getChiOptions(p.hand, tile); if(c.length) opts.can.chi=c; }
    if(Object.keys(opts.can).length) res.push(opts);
  }
  return res;
}

/* 下家摸牌 */
function nextTurnDraw(fromSeat){
  const next=(fromSeat+1)%4;
  G.turn=next; G.turnState='draw'; G.pending=null;
  drawTile(next);
}

/* ---------------- 處理回應 ---------------- */
/* 玩家選擇 pass / chi / pong / kong / win，寫進 pending.responses，
   由「打牌者」端或任一端做仲裁——這裡採：每端在收到完整 responses 後仲裁，
   為避免重複，只有「打牌者座位的客戶端」執行仲裁與後續寫入。 */
function submitResponse(seat, action, payload){
  if(!G || !G.pending) return;
  G.pending.responses[seat] = {action, payload:payload||null, ts:Date.now()};
  pushG();
  // 回應後本端也立即嘗試仲裁一次（若本端剛好是仲裁者就能馬上推進，不必等事件/輪詢）
  setTimeout(()=>{ try{ tryResolvePending(); }catch(e){ console.error('仲裁出錯',e); } }, 60);
}

/* 仲裁：當所有 responder 都已回應（或有人胡/碰槓搶先）。
   統一由「AI 主控」（在座真人中座位最小者）負責，確保只有一端仲裁、不打架，
   且主控必為在線真人，計時器與資料同步都活著，不會像「打牌者仲裁」那樣依賴
   某個可能分心/離線的特定玩家而卡住。 */
function tryResolvePending(){
  if(!G || !G.pending) return;
  if(!amAIController()) return;        // 只有主控仲裁
  const pend = G.pending;

  // 有人選胡 → 立即結算（胡優先於碰吃，多家取近打牌者者，一炮多響簡化為單響）
  const winSeat = pend.responders
    .map(r=>r.seat)
    .filter(s=>pend.responses[s] && pend.responses[s].action==='win')
    .sort((a,b)=> seatDist(pend.from,a)-seatDist(pend.from,b))[0];
  if(winSeat!==undefined){
    settleWin(winSeat, pend.tile, false);
    return;
  }

  const allIn = pend.responders.every(r => pend.responses[r.seat]);
  if(!allIn){
    // 還沒全部回應。若「還沒回應的人裡有真人」，一律等待（給人類充足時間按碰/吃/胡），
    // 不可因 AI 已 pass 就推進，否則會搶掉玩家的碰。
    const humanPending = pend.responders.some(r=>
      !pend.responses[r.seat] && !seatIsAI(r.seat));
    if(humanPending){
      // 反應視窗保護：人類最多等 15 秒，逾時才視為放棄(避免有人離線永遠卡住)
      if(!pend._ts) pend._ts = Date.now();
      if(Date.now() - pend._ts < 15000) return;   // 還在反應時間內 → 等
      // 逾時：把未回應的真人視為 pass
      pend.responders.forEach(r=>{
        if(!pend.responses[r.seat]) pend.responses[r.seat]={action:'pass',ts:Date.now()};
      });
    }else{
      return; // 還沒回應的都是 AI → 等 AI 回應(由 aiDriver 處理)
    }
  }

  // 碰/槓 優先於 吃
  const pg = pend.responders.map(r=>r.seat)
    .filter(s=>{const a=pend.responses[s]; return a && (a.action==='pong'||a.action==='kong');})[0];
  if(pg!==undefined){
    doPongKong(pg, pend.tile, pend.responses[pg].action);
    return;
  }
  const chiSeat = pend.responders.map(r=>r.seat)
    .filter(s=>{const a=pend.responses[s]; return a && a.action==='chi';})[0];
  if(chiSeat!==undefined){
    doChi(chiSeat, pend.tile, pend.responses[chiSeat].payload);
    return;
  }
  // 全部 pass → 下家摸
  nextTurnDraw(pend.from);
  pushG();
}

function seatDist(from,to){ return (to - from + 4)%4; }

/* 執行碰／槓 */
function doPongKong(seat, tile, kind){
  const p=G.players[seat];
  // 從打牌者棄牌河移除該張（被吃碰）
  const fromP=G.players[G.lastDiscard.seat];
  const di=fromP.discards.lastIndexOf(tile);
  if(di>=0) fromP.discards.splice(di,1);

  if(kind==='pong'){
    removeN(p.hand, tile, 2);
    p.melds.push({type:'pong', tile, tiles:[tile,tile,tile], from:G.lastDiscard.seat});
    G.turn=seat; G.turnState='discard'; G.pending=null; G.lastDiscard=null; G.justDrawn=null;
    G.log=p.name+' 碰 '+MJ.zhTile(tile);
    G.actionFlash={type:'pong', seat, tile, name:p.name, ts:Date.now()};
    pushG(); speak(p.name+'碰');
  }else{ // 明槓
    removeN(p.hand, tile, 3);
    p.melds.push({type:'kong', tile, tiles:[tile,tile,tile,tile], from:G.lastDiscard.seat});
    G.pending=null; G.lastDiscard=null;
    G.log=p.name+' 槓 '+MJ.zhTile(tile)+'，補牌';
    G.actionFlash={type:'kong', seat, tile, name:p.name, ts:Date.now()};
    // 槓後從牌尾補一張（簡化：從牌牆尾端）
    kongDraw(seat);
    speak(p.name+'槓');
  }
}

/* 吃 */
function doChi(seat, tile, payload){
  const p=G.players[seat];
  const fromP=G.players[G.lastDiscard.seat];
  const di=fromP.discards.lastIndexOf(tile);
  if(di>=0) fromP.discards.splice(di,1);
  // payload = [t2,t3] 手牌中兩張
  removeN(p.hand, payload[0], 1);
  removeN(p.hand, payload[1], 1);
  const tiles=MJ.sortTiles([tile,payload[0],payload[1]]);
  p.melds.push({type:'chi', tile, tiles, from:G.lastDiscard.seat});
  G.turn=seat; G.turnState='discard'; G.pending=null; G.lastDiscard=null; G.justDrawn=null;
  G.log=p.name+' 吃 '+MJ.zhTile(tile);
  G.actionFlash={type:'chi', seat, tile, name:p.name, ts:Date.now()};
  pushG(); speak(p.name+'吃');
}

/* 槓後補牌（牌尾） */
function kongDraw(seat){
  if(G.deckPos>=G.deck.length){ G.phase='over'; G.log='流局'; G.result={draw:true}; pushG(); return; }
  const t=G.deck[G.deck.length-1]; G.deck.pop();
  G.players[seat].hand=MJ.sortTiles(G.players[seat].hand.concat([t]));
  G.justDrawn=t; G.wallCount=G.deck.length-G.deckPos;
  G.turn=seat; G.turnState='discard';
  // 槓上開花判斷由該玩家自摸時 afterKong=true（簡化：標記）
  G._afterKong=true;
  pushG();
}

/* 自摸胡（自己回合 turnState=discard 時可宣告） */
function declareSelfWin(seat){
  settleWin(seat, G.justDrawn, true);
}

/* 暗槓（自己回合） */
function declareAnkong(seat, tile){
  const p=G.players[seat];
  removeN(p.hand, tile, 4);
  p.melds.push({type:'ankong', tile, tiles:[tile,tile,tile,tile]});
  G.log=p.name+' 暗槓';
  kongDraw(seat);
  speak(p.name+'暗槓');
}

function removeN(arr, t, n){ for(let k=0;k<n;k++){const i=arr.indexOf(t); if(i>=0)arr.splice(i,1);} }

/* ---------------- 結算 ---------------- */
function settleWin(seat, winTile, selfDraw){
  // 防重入：已結束就不再結算，避免輪詢/事件重複呼叫把分數灌爆
  if(!G || G.phase==='over' || G.winner!=null) return;
  // 先鎖定狀態，再算分（避免算分過程中又被觸發）
  G.phase='over';
  G.winner=seat;
  G.pending=null;            // 清掉待回應，否則仲裁會再次觸發結算

  const p=G.players[seat];
  // 組成 ctx
  const handForScore = selfDraw ? p.hand.slice() : MJ.sortTiles(p.hand.concat([winTile]));
  const ctx={
    handTiles: handForScore,
    melds: p.melds,
    winTile,
    selfDraw,
    seatWind: p.wind,
    roundWind: G.roundWind,
    isBanker: seat===G.dealer,
    bankerStreak: (seat===G.dealer? G.bankerStreak: 0),
    afterKong: !!G._afterKong && selfDraw,
    isLastTile: G.wallCount===0,
  };
  const score = MJ.scoreWin(ctx);
  // 底 + 台（底=1，每台=1，可自行調整）
  const BASE=1;
  const taiTotal = score.total;
  const payEach = BASE + taiTotal;

  // 結算分數：自摸三家付，食胡放槍者付
  const players=G.players;
  if(selfDraw){
    for(let s=0;s<4;s++) if(s!==seat){ players[s].score -= payEach; players[seat].score += payEach; }
  }else{
    const loser = G.lastDiscard ? G.lastDiscard.seat : seat;
    if(loser!==seat){ players[loser].score -= payEach; players[seat].score += payEach; }
  }

  // 連莊判斷
  const dealerWon = (seat===G.dealer);
  let newDealer=G.dealer, newStreak=G.bankerStreak, newRound=G.roundWind;
  if(dealerWon){ newStreak=G.bankerStreak+1; }
  else {
    newDealer=(G.dealer+1)%4; newStreak=0;
    if(newDealer===0){ // 一圈結束換風
      const ri=WINDS.indexOf(G.roundWind); newRound=WINDS[(ri+1)%4];
    }
  }

  G.result={
    seat, selfDraw, winTile, taiTotal, payEach,
    items: score.items,
    hand: handForScore, melds: p.melds,
    loser: selfDraw? null : (G.lastDiscard? G.lastDiscard.seat : null),
    nextDealer:newDealer, nextStreak:newStreak, nextRound:newRound,
  };
  G._afterKong=false;
  G.log=p.name+(selfDraw?' 自摸！':' 胡牌！')+' '+taiTotal+' 台';
  G.actionFlash={type:selfDraw?'tsumo':'win', seat, tile:winTile, name:p.name, tai:taiTotal, ts:Date.now()};
  pushG();
  speak(p.name+(selfDraw?'自摸':'胡牌')+'，'+taiTotal+'台');
}

/* 下一局（沿用結算的 nextDealer 等） */
function nextRound(){
  if(!G||!G.result) { newGame(false); return; }
  const r=G.result;
  const curNo = G.roundNo||1;
  const total = G.totalRounds||totalRounds;
  if(r.draw){ // 流局：莊家續莊，不算新的一局（局數不變）
    seatNames=G.players.map(p=>p.name);
    newGameWith({dealer:G.dealer,roundWind:G.roundWind,bankerStreak:G.bankerStreak+1,
      scores:G.players.map(p=>p.score), roundNo:curNo, totalRounds:total});
    return;
  }
  // 有人胡 → 這一局結束。檢查是否已達總局數
  seatNames=G.players.map(p=>p.name);
  if(curNo >= total){
    // 全部局數打完 → 進入最終總結算
    G.phase='finished';
    G.finalScores = G.players.map(p=>({name:p.name, score:p.score}));
    pushG();
    speak('全部'+total+'局結束');
    return;
  }
  newGameWith({dealer:r.nextDealer,roundWind:r.nextRound,bankerStreak:r.nextStreak,
    scores:G.players.map(p=>p.score), roundNo:curNo+1, totalRounds:total});
}
function newGameWith(keep){
  const seed=(Date.now()^(Math.random()*1e9))>>>0;
  const rng=MJ.makeRng(seed);
  const deck=MJ.shuffle(MJ.buildWall(),rng);
  const players=[];let pos=0;
  for(let s=0;s<4;s++){
    const hand=[];for(let k=0;k<16;k++)hand.push(deck[pos++]);
    players.push({name:seatNames[s]||('玩家'+(s+1)),score:keep.scores[s],
      hand:MJ.sortTiles(hand),melds:[],discards:[],
      wind:WINDS[(s-keep.dealer+4)%4],connected:true});
  }
  const dd=deck[pos++];players[keep.dealer].hand=MJ.sortTiles(players[keep.dealer].hand.concat([dd]));
  G={phase:'playing',roundWind:keep.roundWind,dealer:keep.dealer,bankerStreak:keep.bankerStreak,
    roundNo:(keep.roundNo||1), totalRounds:(keep.totalRounds||totalRounds),
    turn:keep.dealer,turnState:'discard',players,lastDiscard:null,pending:null,justDrawn:dd,
    deck,deckPos:pos,wallCount:deck.length-pos,
    log:WIND_ZH[keep.roundWind]+'圈・'+players[keep.dealer].name+' 坐莊',
    winner:null,result:null,seed,ts:Date.now()};
  pushG();
  speak(players[keep.dealer].name+'坐莊');
}

/* ===================================================================
   電腦 AI
   - seats[s].isAI === true 代表該座位是電腦
   - 由「真人中座位編號最小者」當主控，在輪到 AI 時自動代為決策並寫雲端
   - 決策：進階傻瓜版（會打孤張、能碰能胡、會挑最接近聽牌的牌打）
   =================================================================== */

function seatIsAI(s){ return !!(seats[s] && seats[s].isAI); }

/* 我是不是 AI 主控？
   原則：所有「在座的真人」中座位編號最小者當主控，負責驅動所有 AI。
   容錯：若 seats 尚未同步、或找不到其他真人，只要我自己在座(mySeat>=0)就兜底當主控，
   避免「沒人驅動 AI」造成卡住。 */
function amAIController(){
  if(mySeat<0) return false;
  // 找出所有在座真人的座位（非AI、有 clientId）
  const humans=[];
  for(let s=0;s<4;s++){
    const o=seats[s];
    if(o && o.clientId && !o.isAI) humans.push(s);
  }
  if(humans.length===0) return true;        // seats 還沒同步到我 → 自己兜底
  return humans[0]===mySeat;                 // 編號最小的真人當主控
}

const AI_DELAY = 900;
let aiActingUntil = 0;   // AI 正在行動的「鎖定到期時間」，到期自動解鎖避免永久卡住

/* AI 主控驅動：每次狀態更新後、以及輪詢計時器，都會呼叫這裡檢查是否該幫某 AI 行動。
   採「軟鎖 + 到期自動解除」：避免事件鏈斷掉後 AI 永久卡住。 */
function aiDriver(){
  if(!G || G.phase!=='playing') return;
  if(!amAIController()) return;          // 只有主控執行，避免多端重複
  if(Date.now() < aiActingUntil) return; // 仍在上一個 AI 動作的等待中

  // 找出「現在該由哪個 AI 做什麼」
  // 1) 有待回應(pending) 且某 AI 還沒回應 → 幫它回應
  if(G.pending){
    const pend=G.pending;
    const aiToRespond = pend.responders.map(r=>r.seat)
      .find(s=> seatIsAI(s) && !pend.responses[s]);
    if(aiToRespond!==undefined){
      aiActingUntil = Date.now() + AI_DELAY + 1500;
      setTimeout(()=>{
        aiActingUntil = 0;
        try{ if(G && G.pending && !G.pending.responses[aiToRespond]) aiRespond(aiToRespond); }
        catch(e){ console.error('AI回應出錯',e); }
        try{ tryResolvePending(); }catch(e){ console.error('仲裁出錯',e); }  // 回應後立即仲裁
        aiDriver();
      }, AI_DELAY);
      return;
    }
    // pending 存在但 AI 都回應完了 → 直接嘗試仲裁(避免卡在等仲裁)
    try{ tryResolvePending(); }catch(e){ console.error('仲裁出錯',e); }
  }
  // 2) 輪到某 AI 摸牌
  if(seatIsAI(G.turn) && G.turnState==='draw'){
    const seat=G.turn;
    aiActingUntil = Date.now() + AI_DELAY + 1500;
    setTimeout(()=>{
      aiActingUntil = 0;
      try{ if(G && seatIsAI(G.turn) && G.turn===seat && G.turnState==='draw') drawTile(seat); }
      catch(e){ console.error('AI摸牌出錯',e); }
      aiDriver();
    }, AI_DELAY);
    return;
  }
  // 3) 輪到某 AI 出牌
  if(seatIsAI(G.turn) && G.turnState==='discard'){
    const seat=G.turn;
    aiActingUntil = Date.now() + AI_DELAY + 1500;
    setTimeout(()=>{
      aiActingUntil = 0;
      try{ if(G && seatIsAI(G.turn) && G.turn===seat && G.turnState==='discard') aiDiscard(seat); }
      catch(e){ console.error('AI出牌出錯',e); }
      aiDriver();
    }, AI_DELAY);
    return;
  }
}

/* 輪詢保險：定期檢查，即使事件鏈斷掉也能把卡住的 AI / 仲裁救回來 */
function pollTick(){
  try{ tryResolvePending(); }catch(e){ console.error('仲裁出錯',e); }
  try{ aiDriver(); }catch(e){ console.error('AI驅動出錯',e); }
}
setInterval(pollTick, 800);
// 分頁回到前景 / 手機螢幕重新亮起 → 計時器可能被瀏覽器凍結過，立即補一次驅動
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ aiActingUntil=0; pollTick(); } });
window.addEventListener('focus', ()=>{ aiActingUntil=0; pollTick(); });

/* AI 出牌決策 */
function aiDiscard(seat){
  const p=G.players[seat];
  if(G.justDrawn && MJ.isWinningHand(p.hand, p.melds.length)){
    settleWin(seat, G.justDrawn, true); return;   // 自摸胡
  }
  const ak=MJ.getConcealedKongs(p.hand);
  if(ak.length){ declareAnkong(seat, ak[0]); return; }  // 有暗槓就槓
  const tile = aiChooseDiscard(p.hand, p.melds.length);
  discardTile(seat, tile);
}

/* 選最佳棄牌：丟掉後若聽牌優先，否則挑讓手牌啟發式分數最高的丟 */
function aiChooseDiscard(hand, meldCount){
  const uniq=[...new Set(hand)];
  let bestTile=null, bestScore=-1e9;
  for(const t of uniq){
    const rest=hand.slice(); rest.splice(rest.indexOf(t),1);
    const waits=MJ.getWaits(rest, meldCount);
    const score = waits.length>0 ? (1000 + waits.length*10) : aiHandValue(rest);
    if(score>bestScore){ bestScore=score; bestTile=t; }
  }
  return bestTile!=null? bestTile : hand[hand.length-1];
}

/* 手牌啟發式評分：搭子越多越好，孤張(尤其字牌、邊張)扣分 */
function aiHandValue(hand){
  const c=MJ.toCounts(hand);
  let score=0;
  for(const t in c){
    const n=c[t];
    if(n>=3) score+=12; else if(n===2) score+=6;
    if(MJ.isSuited(t)){
      const s=t[0], num=MJ.tileNum(t);
      if(c[s+(num+1)]) score+=4;
      if(c[s+(num+2)]) score+=2;
    }
  }
  for(const t in c){
    if(c[t]===1){
      if(MJ.isHonor(t)) score-=3;
      else{
        const s=t[0], num=MJ.tileNum(t);
        const nb = c[s+(num-1)]||c[s+(num+1)]||c[s+(num-2)]||c[s+(num+2)];
        if(!nb) score-=2;
        if(num===1||num===9) score-=0.5;
      }
    }
  }
  return score;
}

/* AI 回應吃碰槓胡：胡必應，碰/槓視情況，吃保守 */
function aiRespond(seat){
  if(!G.pending) return;
  const me=G.pending.responders.find(r=>r.seat===seat);
  if(!me) return;
  const can=me.can;
  if(can.win){ submitResponse(seat,'win'); return; }
  if(can.pong){
    const tile=G.pending.tile;
    const p=G.players[seat];
    if(MJ.isHonor(tile) || p.melds.length>0){ submitResponse(seat,'pong'); return; }
    // 否則保守不碰(避免破壞順子手)
  }
  if(can.kong){ submitResponse(seat,'kong'); return; }
  // 吃:保守不主動吃
  submitResponse(seat,'pass');
}

/* ===================================================================
   渲染
   =================================================================== */
function render(){
  if(!G){ return; }
  // 圈/莊/牌牆
  $('cRoundWind').textContent = WIND_ZH[G.roundWind];
  $('cDealer').innerHTML = '<span class="d-line">莊家：'+escapeHtml(G.players[G.dealer].name)+'</span>'+
    (G.bankerStreak>0? '<span class="d-line">（連'+G.bankerStreak+'）</span>' : '');
  $('cWall').textContent = G.wallCount;
  const rno=G.roundNo||1, rtot=G.totalRounds||totalRounds;
  const roundLabel = rtot>=999 ? '' : ('　<span style="color:var(--muted);font-size:12px">第'+rno+'/'+rtot+'局</span>');
  $('roundInfo').innerHTML = WIND_ZH[G.roundWind]+'圈　<b>'+G.players[G.dealer].name+'</b> 莊'+roundLabel;
  $('cLastDiscard').textContent = '';   // 改用「隨玩家位置變動的動作框」(positionWideLast/showWideAction)

  // 座位對應：把「我的座位」放底部，其餘順時針 right/top/left
  const order = mySeat>=0
    ? [mySeat,(mySeat+1)%4,(mySeat+2)%4,(mySeat+3)%4]
    : [0,1,2,3];
  renderSeat($('seatBottom'),order[0],'bottom');
  renderSeat($('seatRight'), order[1],'right');
  renderSeat($('seatTop'),   order[2],'top');
  renderSeat($('seatLeft'),  order[3],'left');

  renderDiscards();
  renderWideOpp();
  renderActions();
  renderRespond();
  renderResult();
  checkMyTurnAlert();
  checkActionFlash();
  positionWideLast();      // 橫式:中央「打出X」框隨行動玩家移到該玩家旁邊;自己行動時回中央
  // 橫式:把手牌往左偏移半個副露寬度,讓「副露+手牌」整體在畫面正中央
  adjustWideHandCenter();
}

/* 偵測有人吃碰槓胡 → 中央彈出大字提示讓所有人看清楚發生什麼 */
let _lastActionFlashTs = 0;
function checkActionFlash(){
  if(!G || !G.actionFlash) return;
  const af = G.actionFlash;
  if(af.ts === _lastActionFlashTs) return;   // 同一次,不重複顯示
  _lastActionFlashTs = af.ts;
  // 自己做的動作不必再彈(自己很清楚做了什麼);只給其他人看
  if(af.seat === mySeat) return;
  // 橫式:動作徽章已顯示在該玩家旁邊,不再用中央大字彈窗
  if(document.body.classList.contains('wide')) return;
  showActionFlash(af);
}

/* 橫式:中央「○○ 打出 X」框隨行動玩家移動位置
   - 對手做動作 → 移到該對手卡片正下方
   - 自己做動作 / 無人或不適用時 → 回到畫面中央
   打牌走 wideLast(穩定低調),碰吃槓胡走 wideAction(獨立、發亮、顯眼) */
function positionWideLast(){
  const wl = document.getElementById('wideLast');
  const wt = document.getElementById('wideLastTile');
  if(!wl || !wt) return;
  const lbl = wl.querySelector('.wl-label');
  const isWide = document.body.classList.contains('wide');

  // 找出最新動作:比較 actionFlash 跟 lastDiscard
  let latest = null;
  const af = G.actionFlash;
  const ld = G.lastDiscard;
  const ldTs = (_lastShownDiscard && ld && _lastShownDiscard.seat===ld.seat && _lastShownDiscard.tile===ld.tile) ? _lastShownDiscard.ts : 0;
  const afTs = af ? (af.ts||0) : 0;
  if(afTs > ldTs && af){
    latest = { seat:af.seat, type:af.type, tile:af.tile, name:af.name, ts:afTs };
  }else if(ld){
    latest = { seat:ld.seat, type:'discard', tile:ld.tile, name:G.players[ld.seat].name, ts:ldTs };
  }

  // ---- wideLast:顯示「打出 X」隨打牌玩家位置變動 ----
  // 結算/總結算時隱藏(避免提示框擋住「下一局/看總結算」按鈕)
  const ldShow = _lastShownDiscard;
  const isResulting = (G.phase==='over' || G.phase==='finished');
  wt.innerHTML='';
  if(!ldShow || isResulting){
    if(lbl) lbl.textContent='';
    wl.style.display='none';
  }else{
    const who = G.players[ldShow.seat];
    if(lbl) lbl.textContent = (who?who.name:'') + ' 打出';
    wt.appendChild(tileEl(ldShow.tile));
    wl.style.display='flex';
    // 定位:依版面選策略
    if(isWide){
      // 橫式:自己→右,對手→對手卡片下方
      if(ldShow.seat === mySeat){
        wl.style.left='auto'; wl.style.right='8px';
        wl.style.top='50%'; wl.style.bottom='auto';
        wl.style.transform='translateY(-50%)';
      }else{
        wl.style.right='auto'; wl.style.bottom='auto';
        positionElByOpp(wl, ldShow.seat);
      }
    }else{
      // 非橫式(完整佈局/直式精簡):四方座位
      positionElBySeat(wl, ldShow.seat);
    }
  }

  // ---- wideAction:單獨彈出顯示「吃/碰/槓/胡/自摸」,發亮、顯眼 ----
  showWideAction(latest);
}

/* 把元素定位到「該玩家座位」附近(非橫式四方佈局用)
   - 自己 (bottom) → 手牌上方
   - 對家 (top) → 對家牌下方
   - 上家 (left) → 上家牌右側
   - 下家 (right) → 下家牌左側 */
function positionElBySeat(el, seat){
  // mySeat 在底、下家在右、對家在上、上家在左
  // 計算相對位置 dPos: 0=bottom, 1=right, 2=top, 3=left
  const dPos = (seat - mySeat + 4) % 4;
  const tableEl = document.getElementById('table');
  if(!tableEl) return;
  el.style.position='absolute';
  // 全部明確設 auto 避免 CSS 預設值殘留或 transition 中兩邊同時有值撐大元素
  el.style.left='auto'; el.style.right='auto'; el.style.top='auto'; el.style.bottom='auto';
  if(dPos===0){
    // 自己:畫面正下方手牌上方
    el.style.left='50%';
    el.style.bottom='calc(min(10vw,64px) + 120px)';
    el.style.transform='translateX(-50%)';
  }else if(dPos===2){
    // 對家:畫面上方對手牌下方
    el.style.left='50%';
    el.style.top='calc(min(10vw,64px) + 80px)';
    el.style.transform='translateX(-50%)';
  }else if(dPos===1){
    // 下家(右側)
    el.style.right='6vw';
    el.style.top='50%';
    el.style.transform='translateY(-50%)';
  }else{
    // 上家(左側)
    el.style.left='6vw';
    el.style.top='50%';
    el.style.transform='translateY(-50%)';
  }
}

/* 把元素定位到對手卡片下方 */
function positionElByOpp(el, seat){
  const oppCard = document.querySelector('#wideOppBar .opp[data-seat="'+seat+'"]');
  const tableEl = document.getElementById('table');
  if(!oppCard || !tableEl) return;
  const rect = oppCard.getBoundingClientRect();
  const tRect = tableEl.getBoundingClientRect();
  const cx = rect.left - tRect.left + rect.width/2;
  const top = rect.bottom - tRect.top + 8;
  el.style.left = cx + 'px';
  el.style.right = 'auto';
  el.style.top  = top + 'px';
  el.style.bottom = 'auto';
  el.style.transform = 'translateX(-50%)';
}

/* 顯示「吃/碰/槓/胡/自摸」獨立發亮視窗,綁定到該玩家位置 */
let _lastWideActionKey = '';
function showWideAction(latest){
  let el = document.getElementById('wideAction');
  if(!el){
    el = document.createElement('div');
    el.id = 'wideAction';
    document.getElementById('table').appendChild(el);
  }
  // 只在「吃碰槓胡自摸」時顯示;打牌不顯示在這裡
  if(!latest || latest.type==='discard' || !['pong','kong','chi','win','tsumo'].includes(latest.type)){
    el.classList.remove('show');
    return;
  }
  const key = latest.seat+'_'+latest.type+'_'+latest.tile+'_'+latest.ts;
  if(key === _lastWideActionKey) return;     // 同一次,不重彈
  _lastWideActionKey = key;
  const verb =
    latest.type==='pong'  ? '碰' :
    latest.type==='kong'  ? '槓' :
    latest.type==='chi'   ? '吃' :
    latest.type==='win'   ? '胡!' :
    latest.type==='tsumo' ? '自摸!' : '';
  const isWin = latest.type==='win' || latest.type==='tsumo';
  el.className = isWin? 'win' : '';
  el.innerHTML =
    '<div class="wa-row"><span class="wa-name">'+escapeHtml(latest.name||'')+'</span>'+
    '<span class="wa-verb">'+verb+'</span></div>'+
    (latest.tile? '<div class="wa-tile"></div>' : '');
  if(latest.tile){
    const tw = el.querySelector('.wa-tile');
    if(tw) tw.appendChild(tileEl(latest.tile));
  }
  // 定位:綁玩家位置(依版面選策略)
  const isWide = document.body.classList.contains('wide');
  if(isWide){
    if(latest.seat === mySeat){
      el.style.left='50%';
      el.style.top='34%';
      el.style.right=''; el.style.bottom='';
      el.style.transform='translateX(-50%)';
    }else{
      positionElByOpp(el, latest.seat);
    }
  }else{
    // 非橫式:用四方座位定位
    positionElBySeat(el, latest.seat);
  }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  // 2.5 秒後自動隱藏
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.classList.remove('show'); _lastWideActionKey=''; }, 2500);
}
function showActionFlash(af){
